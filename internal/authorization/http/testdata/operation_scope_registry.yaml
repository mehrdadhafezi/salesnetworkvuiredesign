# RM-E04B / A4 (NT-22) — API operation scope registry.
#
# One entry per OpenAPI operation of api/openapi/openapi.bundled.yaml. This
# file is test data only: no runtime code reads it, and it grants nothing.
# It is validated, in both directions, against the contract and against the
# composed handlers by internal/authorization/http/operation_registry_test.go
# (go test ./...). An operation that is not listed here fails CI.
#
# Format and vocabulary: docs/remediation/rm-e04b-operation-scope-inventory.md.
#
#   category  PUBLIC_HEALTH | SESSION_READ | SESSION_COMMAND | ORG_READ |
#             OWN_READ | REVIEW_READ | BUSINESS_COMMAND
#   scope     ORGANIZATION | OWN:<basis> | COMMAND:<basis> | SESSION_SELF |
#             NOT_APPLICABLE   (bases are closed lists in the test)
#   subject   NONE | SESSION_PRINCIPAL | ANONYMOUS_CREDENTIAL_EXCHANGE |
#             AUTHENTICATED_PRINCIPAL | AUTHENTICATED_USER_ID
#   nt07      REQUIRED (NT-07 runs) | EXEMPT (approved list in the test) |
#             NOT_A_READ (command; NT-07 does not apply)
#   unproven_user (OWN_READ only, observed by the test):
#             REFUSED_ROW_SCOPE_DENIED | NOT_FOUND_WITHOUT_QUERY |
#             EMPTY_WITHOUT_QUERY | QUERY_BEFORE_IDENTITY
#   also_requires  further gate capabilities, in order (observed)
#   field_capabilities  capabilities that only mask fields (reviewer-verified)
#   tests     <repo-relative _test.go file>:<TestName> (must exist)
#
# Adding, removing or relabelling an entry is a security change and needs
# review. Labels do not grant anything and cannot hide handler behaviour:
# capability, NT-07 coverage and unproven-user behaviour are observed.

