components:
  parameters:
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional client correlation id. Invalid values are replaced by a server-generated id.
      schema:
        $ref: '#/components/schemas/CorrelationID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every future mutating command (Architecture V1 §23). Same key
        and same request replays the stored result; same key with a different
        request is CONFLICT.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,128}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Aggregate version (ETag) for optimistic concurrency on versioned mutations; mismatch is CONFLICT.
      schema:
        type: string
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from PageInfo.next_cursor.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive substring of the display name (persons also match the employee code).
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Presence:
      name: presence
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Presence'
    UserSort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort; a leading "-" is descending.
      schema:
        type: string
        enum:
          - display_name
          - -display_name
        default: display_name
    EmploymentStatus:
      name: employment_status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EmploymentStatus'
    PositionID:
      name: position_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NativeID'
    LevelID:
      name: level_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NativeID'
    OrgUnitID:
      name: org_unit_id
      in: query
      required: false
      description: Matches the person's department, unit or team.
      schema:
        $ref: '#/components/schemas/NativeID'
    IsActive:
      name: is_active
      in: query
      required: false
      schema:
        type: boolean
    HasFindings:
      name: has_findings
      in: query
      required: false
      schema:
        type: boolean
    PersonSort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort; a leading "-" is descending.
      schema:
        type: string
        enum:
          - display_name
          - -display_name
          - employee_code
          - -employee_code
          - employment_status
          - -employment_status
        default: display_name
    OrgUnitKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrgUnitKind'
    PersonID:
      name: person_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NativeID'
    Relation:
      name: relation
      in: query
      required: false
      description: With person_id, restrict to assignments where the person is the CHILD or the PARENT.
      schema:
        type: string
        enum:
          - CHILD
          - PARENT
    IsCurrent:
      name: is_current
      in: query
      required: false
      schema:
        type: boolean
    RelationshipKind:
      name: relationship_kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - REPORTS_TO
          - UNMAPPED
    FindingKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FindingKind'
    FindingSeverity:
      name: severity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FindingSeverity'
    FindingSubject:
      name: subject_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FindingSubject'
    ResolutionState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ResolutionState'
    HasConflict:
      name: has_conflict
      in: query
      required: false
      schema:
        type: boolean
    Strength:
      name: strength
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Strength'
    EvidenceStrength:
      name: evidence_strength
      in: query
      required: false
      description: The strongest evidence of the case.
      schema:
        $ref: '#/components/schemas/Strength'
    CaseReason:
      name: reason
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CaseReason'
    CustomerID:
      name: customer_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NativeID'
    WorkflowType:
      name: workflow_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/WorkflowType'
    StateMapping:
      name: state_mapping
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/StateMapping'
    CustomerLinkState:
      name: customer_link_state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ResolutionState'
    CaseID:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NativeID'
    Parity:
      name: parity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Parity'
    Derivation:
      name: derivation
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Derivation'
    CaseLinkState:
      name: case_link_state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ResolutionState'
    HasUnknownStatus:
      name: has_unknown_status
      in: query
      required: false
      description: Invoices with (true) / without (false) any UNKNOWN raw invoice or stage state.
      schema:
        type: boolean
    InvoiceID:
      name: invoice_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NativeID'
    PaymentChannel:
      name: channel
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentChannel'
    TargetMapping:
      name: state_mapping
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TargetMapping'
    AttemptState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AttemptState'
    ApprovalProvenance:
      name: approval_provenance
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalProvenance'
    InvoiceLinkState:
      name: invoice_link_state
      in: query
      required: false
      schema:
        type: string
        enum:
          - RESOLVED
          - UNKNOWN
    AttemptID:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NativeID'
    ReceiptID:
      name: receipt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NativeID'
    MetricID:
      name: metric_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        maxLength: 80
    ReportTimeBasis:
      name: time_basis
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReportTimeBasis'
    RangeFrom:
      name: from
      in: query
      required: false
      description: EVENT_RANGE start (inclusive, RFC 3339 UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    RangeTo:
      name: to
      in: query
      required: false
      description: EVENT_RANGE end (exclusive, RFC 3339 UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    AsOf:
      name: as_of
      in: query
      required: false
      description: HISTORICAL_AS_OF instant (RFC 3339 UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    RunID:
      name: run_id
      in: query
      required: false
      description: Pin the projection run (cutoff) to reproduce an answer.
      schema:
        $ref: '#/components/schemas/NativeID'
    ReportScope:
      name: scope
      in: query
      required: false
      description: Part of the query contract; only ORGANIZATION has frozen authority (never broadened by a client).
      schema:
        type: string
        enum:
          - ORGANIZATION
    OriginalOwnerResolution:
      name: original_owner_resolution
      in: query
      required: false
      schema:
        type: string
        enum:
          - RESOLVED
          - RELATED
          - UNKNOWN
          - CONFLICT
          - NOT_RECOVERABLE
          - NOT_CAPTURED
    MainMapping:
      name: main_mapping
      in: query
      required: false
      schema:
        type: string
        enum:
          - KNOWN_VOCABULARY
          - UNKNOWN
          - EMPTY
    TotalClass:
      name: total_class
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TotalClass'
    InvoiceUnit:
      name: unit
      in: query
      required: false
      schema:
        type: string
        enum:
          - IRT
          - IRR
          - UNATTRIBUTED
    ReportAttemptState:
      name: state
      in: query
      required: false
      description: Explicit attempt state, or UNMAPPED when the raw state has no verified mapping.
      schema:
        type: string
        enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - CANCELLED
          - RECONCILIATION_REQUIRED
          - UNMAPPED
    PaymentUnit:
      name: unit
      in: query
      required: false
      schema:
        type: string
        enum:
          - IRT
          - IRR
          - NONE
    FinanceRunID:
      name: run_id
      in: query
      required: false
      description: Pin the shadow run (source cutoff + snapshot). Omitted = the latest run; the answer names the run it used.
      schema:
        type: string
        format: uuid
    AccountCategory:
      name: account_category
      in: query
      required: false
      schema:
        type: string
        enum:
          - customer_receivable
          - revenue_by_product_kind
          - cash_bank_clearing
          - commission_payable
          - legacy_wallet_unclassified
          - legacy_wallet_contra
    ShadowBasis:
      name: basis
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ShadowBasis'
    FinanceUnit:
      name: unit
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Unit'
    EntryState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - CONSISTENT
          - CONFLICT
          - UNRESOLVED_CORRECTION
    SourceType:
      name: source_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - billing.invoice
          - payments.attempt
          - legacy.wallet_transaction
    EffectiveFrom:
      name: effective_from
      in: query
      required: false
      description: Entries whose evidenced effective time is at or after (UTC). Entries with an unknown effective time never match a date range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    EffectiveTo:
      name: effective_to
      in: query
      required: false
      description: Entries whose evidenced effective time is before (UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    BalanceState:
      name: state
      in: query
      required: false
      description: The legacy comparison state of the balance, or NOT_COMPARABLE when no legacy figure exists.
      schema:
        type: string
        enum:
          - MATCH
          - MISMATCH
          - UNKNOWN
          - INCOMPLETE
          - CONFLICT
          - NOT_RECOVERABLE
          - NOT_COMPARABLE
    ReconciliationUnit:
      name: unit
      in: query
      required: false
      schema:
        type: string
        enum:
          - IRR
          - IRT
          - UNKNOWN
    ReconciliationState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReconciliationState'
    SubjectType:
      name: subject_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - legacy_wallet
          - invoice
    BiawinRunID:
      name: run_id
      in: query
      required: false
      description: Pin the import run (snapshot + cutoff). Omitted = the latest run; the answer names the run it used.
      schema:
        type: string
        format: uuid
    BiawinSubscriptionState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SubscriptionState'
    BiawinCustomerLinkState:
      name: customer_link_state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LinkState'
    BiawinInvoiceLinkState:
      name: invoice_link_state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ItemInvoiceLinkState'
    BiawinActivationEvidence:
      name: activation_evidence
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ActivationEvidence'
    BiawinProduct:
      name: product
      in: query
      required: false
      description: Legacy native product key (digits). Never a title match.
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    ParityCheckID:
      name: check_id
      in: query
      required: false
      description: A recorded parity check of the run. Omitted = the latest check of the run.
      schema:
        type: string
        format: uuid
    ParityResultFilter:
      name: result
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ParityResult'
    FulfillmentKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FulfillmentKind'
    FulfillmentStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FulfillmentStatus'
    FulfillmentSubscriptionID:
      name: subscription_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    FulfillmentItemID:
      name: item_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    FulfillmentAssignee:
      name: assignee
      in: query
      required: false
      description: Target user id of a current assignee (never a phone, name or email).
      schema:
        type: string
        format: uuid
  headers:
    CorrelationID:
      description: Correlation id of this request (inbound value when valid, otherwise generated).
      schema:
        $ref: '#/components/schemas/CorrelationID'
    ETag:
      description: Aggregate version for optimistic concurrency (future versioned resources).
      schema:
        type: string
        maxLength: 128
  responses:
    Problem:
      description: RFC 9457 problem details (transport, contract or server error).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Denied:
      description: |
        The caller lacks the evaluated capability (outcome UNAUTHORIZED,
        reason ACTION_DENIED). Server-authoritative; never inferred from role
        names, positions or hierarchy.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
  schemas:
    Outcome:
      type: string
      description: |
        The seven frozen Slice 0 result outcomes (E0 §9A). UNKNOWN is never
        FAILED; PARTIAL is never SUCCESS; CONFLICT is not FAILED; UNAUTHORIZED is
        distinct from BLOCKED.
      enum:
        - SUCCESS
        - PARTIAL
        - FAILED
        - UNKNOWN
        - CONFLICT
        - BLOCKED
        - UNAUTHORIZED
    ReasonCode:
      type: string
      description: foundation-v1 CRM reason codes (Phase-0 spec §6; kernel/reasoncodes).
      enum:
        - DEPENDENCY_FINANCIAL_ACTIVE
        - DEPENDENCY_PROTECTED_DOWNSTREAM
        - DEPENDENCY_UNKNOWN
        - LINKAGE_CONFLICT
        - STALE_STATE
        - ROW_SCOPE_DENIED
        - ACTION_DENIED
        - FIELD_DENIED
        - RECIPIENT_INELIGIBLE
        - OUTCOME_UNKNOWN
        - SOURCE_UNAVAILABLE
        - COVERAGE_INCOMPLETE
        - POLICY_UNRESOLVED
        - FEATURE_DISABLED
        - CONTRACT_INVALID
    CorrelationID:
      type: string
      description: Opaque request correlation identifier.
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
      minLength: 8
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC (suffix Z). Jalali is presentation only.
      pattern: Z$
    Unit:
      type: string
      description: Explicit monetary unit. IRR and IRT are distinct; there is no conversion.
      enum:
        - IRR
        - IRT
    Money:
      type: object
      description: |
        Exact signed int64 amount in an explicit unit (E0 §9D). The amount is a
        decimal string so that no client parses it as a floating-point number.
      required:
        - amount
        - unit
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,18})$
          maxLength: 20
        unit:
          $ref: '#/components/schemas/Unit'
    NativeRef:
      type: object
      description: Domain-qualified native identifier (kernel/refs). Never a phone number.
      required:
        - domain
        - id
      additionalProperties: false
      properties:
        domain:
          type: string
          enum:
            - LEGACY_LEAD
            - V4_DISTRIBUTION
            - MIS_ROW
            - MIS_POOL
            - DOT_CASE
            - INVOICE
            - PAYMENT_STAGE
            - PAYMENT
            - LEDGER_TX
            - EVENT
        id:
          type: string
          pattern: ^[1-9][0-9]{0,19}$
    ItemOutcome:
      type: object
      description: Per-item outcome inside a ResultEnvelope; per-item classes are preserved.
      required:
        - outcome
        - reasons
      additionalProperties: false
      properties:
        item_ref:
          $ref: '#/components/schemas/NativeRef'
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
          maxLength: 500
    ResultEnvelope:
      type: object
      description: |
        Generic business result (Architecture V1 §23). Concrete envelopes add a
        typed data property. An item-level mix aggregates to PARTIAL.
      required:
        - outcome
        - reasons
        - correlation_id
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ItemOutcome'
        reasons:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/ReasonCode'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        audit_id:
          type: string
          format: uuid
          description: Present for sensitive commands (future slices).
    Problem:
      type: object
      description: RFC 9457 problem details with a foundation-v1 reason_code.
      required:
        - type
        - title
        - status
        - reason_code
        - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 256
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          format: uri-reference
          maxLength: 512
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - path
        - reason_code
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 256
          description: JSON pointer-like path of the offending field, e.g. "/amount".
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
          maxLength: 500
    PageInfo:
      type: object
      description: |
        Cursor pagination state. There is deliberately no total: a total is
        returned only when it is part of a metric contract.
      required:
        - has_more
      additionalProperties: false
      properties:
        next_cursor:
          type: string
          maxLength: 512
          nullable: true
        has_more:
          type: boolean
    AllowedAction:
      type: object
      required:
        - allowed
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
    AllowedActions:
      type: object
      description: |
        Server-authoritative permission hints keyed by action name. Clients may
        render them; they never infer permission from roles, hierarchy or routes.
      additionalProperties:
        $ref: '#/components/schemas/AllowedAction'
    HealthLive:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - live
    HealthReady:
      type: object
      required:
        - status
        - checks
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          maxItems: 32
          items:
            type: object
            required:
              - name
              - status
            additionalProperties: false
            properties:
              name:
                type: string
                pattern: ^[a-z][a-z0-9_]{1,63}$
              status:
                type: string
                enum:
                  - ok
                  - failing
    SessionContext:
      type: object
      required:
        - authenticated
        - auth_mode
        - server_time
        - display_zone
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        auth_mode:
          type: string
          description: dev_stub only in development/test; none in production (Slice 2 has no production auth).
          enum:
            - dev_stub
            - none
        principal:
          type: object
          required:
            - principal_id
            - display_name
            - synthetic
          additionalProperties: false
          properties:
            principal_id:
              type: string
              pattern: ^dev-user-[0-9]{3}$
            display_name:
              type: string
              maxLength: 64
            synthetic:
              type: boolean
              enum:
                - true
        capability_hints:
          type: array
          description: Synthetic display-only hints. Never authoritative permissions.
          maxItems: 32
          items:
            type: string
            pattern: ^dev\.[a-z][a-z0-9_.]{1,63}$
        server_time:
          $ref: '#/components/schemas/Timestamp'
        display_zone:
          type: string
          description: Presentation default zone (IANA). Not storage truth.
          enum:
            - Asia/Tehran
        features:
          type: object
          description: |
            Server feature switches for navigation only (Slice 4 rollback is
            flag-off). Never authority: every read is evaluated by the server.
          required:
            - hr_read
            - customers_identity
            - sales_read
            - billing_read
            - reporting_read
            - finance_shadow_read
            - biawin_fulfillment_read
          additionalProperties: false
          properties:
            hr_read:
              type: boolean
            customers_identity:
              type: boolean
              description: Slice 5 customer identity shadow read (flag customers.identity_shadow_read).
            sales_read:
              type: boolean
              description: Slice 6 sales read shadow (flag sales.read_shadow).
            billing_read:
              type: boolean
              description: Slice 7 billing + payments read shadow (flag billing_payments.read_shadow).
            reporting_read:
              type: boolean
              description: Slice 8 MIS / reporting read (flag reporting.read_shadow). Never shows an Invoice Review page.
            finance_shadow_read:
              type: boolean
              description: Slice 9 finance SHADOW ledger read (flag finance.shadow_ledger_read). Read only; never a financial system of record.
            biawin_fulfillment_read:
              type: boolean
              description: Slice 10 Biawin / fulfillment READ shadow (flag biawin_fulfillment.read_shadow). Read only; no portal, activation or workflow action.
    SessionEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
        - data
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/ReasonCode'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        data:
          $ref: '#/components/schemas/SessionContext'
    Presence:
      type: string
      description: Whether the row is in the latest COMPLETE import (absent rows are kept, never deleted).
      enum:
        - PRESENT
        - ABSENT_IN_LATEST
    Reasons:
      type: array
      maxItems: 15
      items:
        $ref: '#/components/schemas/ReasonCode'
    NativeID:
      type: string
      format: uuid
      description: Target native identifier. Never a phone, e-mail, login or legacy key.
    LegacyKey:
      type: string
      description: Legacy source key (provenance only, never identity).
      pattern: ^[1-9][0-9]{0,19}$
    Provenance:
      type: object
      description: Source provenance of an imported shadow row.
      required:
        - source_system
        - source_spec
        - source_key
        - batch_id
        - imported_at
        - refreshed_at
        - presence
      additionalProperties: false
      properties:
        source_system:
          type: string
          maxLength: 16
        source_spec:
          type: string
          maxLength: 80
        source_key:
          $ref: '#/components/schemas/LegacyKey'
        batch_id:
          $ref: '#/components/schemas/NativeID'
        imported_at:
          $ref: '#/components/schemas/Timestamp'
        refreshed_at:
          $ref: '#/components/schemas/Timestamp'
        presence:
          $ref: '#/components/schemas/Presence'
    UserSummary:
      type: object
      required:
        - user_id
        - display_name
        - account_state
        - login_enabled
        - provenance
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/NativeID'
        display_name:
          type: string
          nullable: true
          maxLength: 250
        account_state:
          type: string
          description: Slice 4 accounts are a read/shadow model only.
          enum:
            - SHADOW_IMPORTED
        login_enabled:
          type: boolean
          description: Always false; there is no production authentication in Slice 4.
          enum:
            - false
        provenance:
          $ref: '#/components/schemas/Provenance'
    UserListEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          $ref: '#/components/schemas/Reasons'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
        allowed_actions:
          $ref: '#/components/schemas/AllowedActions'
    UserEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          $ref: '#/components/schemas/Reasons'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        data:
          $ref: '#/components/schemas/UserSummary'
        allowed_actions:
          $ref: '#/components/schemas/AllowedActions'
    EmploymentStatus:
      type: string
      description: Statuses evidenced by the legacy HR UI; anything else is UNMAPPED (raw kept), a missing value is NOT_RECORDED.
      enum:
        - ACTIVE
        - INACTIVE
        - SUSPENDED
        - RESIGNED
        - TERMINATED
        - PROBATION
        - UNMAPPED
        - NOT_RECORDED
    RawText:
      type: string
      nullable: true
      maxLength: 200
      description: Raw legacy value kept verbatim as evidence (not interpreted).
    UserLinkState:
      type: string
      description: Person ↔ account linkage. SHARED_USER means one account is linked to several profiles (conflict).
      enum:
        - LINKED
        - USER_NOT_IMPORTED
        - USER_NOT_RECORDED
        - SHARED_USER
    LookupRef:
      type: object
      required:
        - id
        - slug
        - label
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/NativeID'
        slug:
          type: string
          nullable: true
          maxLength: 100
        label:
          type: string
          nullable: true
          maxLength: 200
    RefState:
      type: string
      description: RESOLVED, NOT_RECORDED (no legacy value) or MISSING (legacy value points nowhere; never invented).
      enum:
        - RESOLVED
        - NOT_RECORDED
        - MISSING
    OrgUnitKind:
      type: string
      enum:
        - DEPARTMENT
        - UNIT
        - TEAM
    UnitRef:
      type: object
      required:
        - id
        - kind
        - label
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/NativeID'
        kind:
          $ref: '#/components/schemas/OrgUnitKind'
        label:
          type: string
          nullable: true
          maxLength: 200
    Employment:
      type: object
      description: Organisation relationship of a person (separate from Person and from User).
      required:
        - employment_id
        - status
        - status_raw
        - type_raw
        - employee_code
        - hire_date
        - hire_date_raw
        - termination_date
        - termination_date_raw
        - is_active
        - user
        - provenance
      additionalProperties: false
      properties:
        employment_id:
          $ref: '#/components/schemas/NativeID'
        status:
          $ref: '#/components/schemas/EmploymentStatus'
        status_raw:
          $ref: '#/components/schemas/RawText'
        type_raw:
          $ref: '#/components/schemas/RawText'
        employee_code:
          type: string
          nullable: true
          maxLength: 100
        hire_date:
          type: string
          format: date
          nullable: true
          description: Calendar date when the raw value is a readable legacy DATE; otherwise null (raw kept).
        hire_date_raw:
          $ref: '#/components/schemas/RawText'
        termination_date:
          type: string
          format: date
          nullable: true
        termination_date_raw:
          $ref: '#/components/schemas/RawText'
        is_active:
          type: boolean
          nullable: true
        user:
          type: object
          required:
            - user_id
            - link_state
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
              nullable: true
            link_state:
              $ref: '#/components/schemas/UserLinkState'
        position:
          $ref: '#/components/schemas/LookupRef'
        position_state:
          $ref: '#/components/schemas/RefState'
        level:
          $ref: '#/components/schemas/LookupRef'
        level_state:
          $ref: '#/components/schemas/RefState'
        department:
          $ref: '#/components/schemas/UnitRef'
        department_state:
          $ref: '#/components/schemas/RefState'
        unit:
          $ref: '#/components/schemas/UnitRef'
        unit_state:
          $ref: '#/components/schemas/RefState'
        team:
          $ref: '#/components/schemas/UnitRef'
        team_state:
          $ref: '#/components/schemas/RefState'
        provenance:
          $ref: '#/components/schemas/Provenance'
    ManagerState:
      type: string
      description: Current reporting parent. MULTIPLE and MISSING are conflicts; NONE is not a defect by itself.
      enum:
        - NONE
        - RESOLVED
        - MULTIPLE
        - MISSING
    PersonRef:
      type: object
      required:
        - person_id
        - employment_id
        - display_name
      additionalProperties: false
      properties:
        person_id:
          $ref: '#/components/schemas/NativeID'
        employment_id:
          $ref: '#/components/schemas/NativeID'
        display_name:
          type: string
          nullable: true
          maxLength: 250
    PersonSummary:
      type: object
      description: |
        A person (HR identity) with field-masked context: employment, structure
        and manager are present only when the caller's evaluated capabilities
        allow them (see allowed_actions).
      required:
        - person_id
        - display_name
        - finding_count
        - provenance
      additionalProperties: false
      properties:
        person_id:
          $ref: '#/components/schemas/NativeID'
        display_name:
          type: string
          nullable: true
          maxLength: 250
        employment:
          $ref: '#/components/schemas/Employment'
        manager_state:
          $ref: '#/components/schemas/ManagerState'
        manager:
          $ref: '#/components/schemas/PersonRef'
        finding_count:
          type: integer
          minimum: 0
        provenance:
          $ref: '#/components/schemas/Provenance'
    PersonListEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          $ref: '#/components/schemas/Reasons'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PersonSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
        allowed_actions:
          $ref: '#/components/schemas/AllowedActions'
    AssignmentEnd:
      type: object
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - RESOLVED
            - MISSING
            - NOT_RECORDED
        person:
          $ref: '#/components/schemas/PersonRef'
    FindingKind:
      type: string
      enum:
        - MISSING_PARENT
        - SELF_PARENT
        - CYCLE
        - DUPLICATE_CURRENT
        - MULTIPLE_CURRENT_PARENTS
        - INTERVAL_OVERLAP
        - HISTORY_GAP
        - UNEXPLAINED_GAP
        - MISSING_CHILD
        - ORG_UNIT_PARENT_MISSING
        - ORG_UNIT_PARENT_NOT_RECORDED
        - MEMBERSHIP_MISMATCH
        - CURRENT_FLAG_INCONSISTENT
        - HISTORY_CURRENT_DISAGREE
        - UNREADABLE_DATE
        - UNMAPPED_RELATIONSHIP
        - MISSING_REFERENCE
        - SHARED_USER
        - USER_NOT_IMPORTED
        - HISTORY_CHANGED
    Assignment:
      type: object
      description: Reporting assignment. Interval values are raw legacy DATETIME text; the source zone is not asserted.
      required:
        - assignment_id
        - child
        - parent
        - relationship_kind
        - relationship_raw
        - effective_from_raw
        - effective_to_raw
        - interval_zone
        - is_current
        - current_raw
        - finding_kinds
        - provenance
      additionalProperties: false
      properties:
        assignment_id:
          $ref: '#/components/schemas/NativeID'
        child:
          $ref: '#/components/schemas/AssignmentEnd'
        parent:
          $ref: '#/components/schemas/AssignmentEnd'
        relationship_kind:
          type: string
          enum:
            - REPORTS_TO
            - UNMAPPED
        relationship_raw:
          $ref: '#/components/schemas/RawText'
        effective_from_raw:
          $ref: '#/components/schemas/RawText'
        effective_to_raw:
          $ref: '#/components/schemas/RawText'
        interval_zone:
          type: string
          enum:
            - UNKNOWN
        is_current:
          type: boolean
          nullable: true
        current_raw:
          $ref: '#/components/schemas/RawText'
        finding_kinds:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FindingKind'
        provenance:
          $ref: '#/components/schemas/Provenance'
    HistoryEntry:
      type: object
      description: Append-only assignment history (free-text reason/context excluded).
      required:
        - history_id
        - action_raw
        - recorded_raw
        - provenance
      additionalProperties: false
      properties:
        history_id:
          $ref: '#/components/schemas/NativeID'
        old_parent:
          $ref: '#/components/schemas/PersonRef'
        new_parent:
          $ref: '#/components/schemas/PersonRef'
        action_raw:
          $ref: '#/components/schemas/RawText'
        recorded_raw:
          $ref: '#/components/schemas/RawText'
        provenance:
          $ref: '#/components/schemas/Provenance'
    FindingSeverity:
      type: string
      enum:
        - CONFLICT
        - UNKNOWN
        - INFO
    FindingSubject:
      type: string
      enum:
        - ASSIGNMENT
        - EMPLOYMENT
        - ORG_UNIT
        - HISTORY
    Finding:
      type: object
      description: A hierarchy finding. Reported, never auto-fixed. Detail names keys and reasons only.
      required:
        - finding_id
        - kind
        - severity
        - subject_type
        - subject_id
        - subject_source_key
        - related_id
        - related_source_key
        - detail
      additionalProperties: false
      properties:
        finding_id:
          $ref: '#/components/schemas/NativeID'
        kind:
          $ref: '#/components/schemas/FindingKind'
        severity:
          $ref: '#/components/schemas/FindingSeverity'
        subject_type:
          $ref: '#/components/schemas/FindingSubject'
        subject_id:
          type: string
          format: uuid
          nullable: true
        subject_source_key:
          type: string
          nullable: true
          maxLength: 20
        related_id:
          type: string
          format: uuid
          nullable: true
        related_source_key:
          type: string
          nullable: true
          maxLength: 20
        detail:
          type: string
          maxLength: 300
    PersonDetail:
      type: object
      required:
        - person
        - assignments
        - direct_reports
        - history
        - findings
      additionalProperties: false
      properties:
        person:
          $ref: '#/components/schemas/PersonSummary'
        assignments:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Assignment'
        direct_reports:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PersonRef'
        history:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/HistoryEntry'
        findings:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Finding'
    PersonEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          $ref: '#/components/schemas/Reasons'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        data:
          $ref: '#/components/schemas/PersonDetail'
        allowed_actions:
          $ref: '#/components/schemas/AllowedActions'
    Lookup:
      type: object
      description: A position or a level (legacy lookup). Position is never a role.
      required:
        - id
        - slug
        - label
        - description
        - sort_order
        - is_active
        - is_system
        - provenance
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/NativeID'
        slug:
          type: string
          nullable: true
          maxLength: 100
        label:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 1000
        sort_order:
          type: integer
          nullable: true
        is_active:
          type: boolean
          nullable: true
        is_system:
          type: boolean
          nullable: true
        provenance:
          $ref: '#/components/schemas/Provenance'
    LookupListEnvelope:
      type: object
      required:
        - outcome
        - reasons
        - correlation_id
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        reasons:
          $ref: '#/components/schemas/Reasons'
        correlation_id:
          $ref: '#/components/schemas/CorrelationID'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Lookup'
        page:
          $ref: '#/components/schemas/PageInfo'
        allowed_actions:
          $ref: '#/components/schemas/AllowedActions'
    OrgUnit:
      type: object
      description: One node of the single typed organisation tree. A MISSING or NOT_RECORDED parent is never attached to a root.
      required:
        - org_unit_id
        - kind
        - slug
        - label
        - sort_order
        - is_active
        - parent_id
        - parent_state
        - member_count
        - finding_kinds
        - provenance
      additionalProperties: false
      properties:
        org_unit_id:
          $ref: '#/components/schemas/NativeID'
        kind:
          $ref: '#/components/schemas/OrgUnitKind'
        slug:
          type: string
          nullable: true
          maxLength: 100
        label:
          type: string
          nullable: true
          maxLength: 200
        sort_order:
          type: integer
          nullable: true
        is_active:
          type: boolean
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        parent_state:
          type: string
          enum:
            - NOT_APPLICABLE
            - NOT_RECORDED
            - RESOLVED
            - MISSING
        member_count:
          type: integer
          minimum: 0
        finding_kinds:
