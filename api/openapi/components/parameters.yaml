CorrelationID:
  name: X-Correlation-ID
  in: header
  required: false
  description: Optional client correlation id. Invalid values are replaced by a server-generated id.
  schema:
    $ref: './schemas.yaml#/CorrelationID'

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Required on every future mutating command (Architecture V1 §23). Same key
    and same request replays the stored result; same key with a different
    request is CONFLICT.
  schema:
    type: string
    pattern: '^[A-Za-z0-9_-]{16,128}$'

IfMatch:
  name: If-Match
  in: header
  required: true
  description: Aggregate version (ETag) for optimistic concurrency on versioned mutations; mismatch is CONFLICT.
  schema:
    type: string
    maxLength: 128

Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor from PageInfo.next_cursor.
  schema:
    type: string
    maxLength: 512

Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50

Query:
  name: q
  in: query
  required: false
  description: Case-insensitive substring of the display name (persons also match the employee code).
  schema:
    type: string
    minLength: 1
    maxLength: 100

Presence:
  name: presence
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/Presence'

UserSort:
  name: sort
  in: query
  required: false
  description: Allowlisted sort; a leading "-" is descending.
  schema:
    type: string
    enum: [display_name, -display_name]
    default: display_name

PersonSort:
  name: sort
  in: query
  required: false
  description: Allowlisted sort; a leading "-" is descending.
  schema:
    type: string
    enum: [display_name, -display_name, employee_code, -employee_code, employment_status, -employment_status]
    default: display_name

EmploymentStatus:
  name: employment_status
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/EmploymentStatus'

PositionID:
  name: position_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

LevelID:
  name: level_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

OrgUnitID:
  name: org_unit_id
  in: query
  required: false
  description: Matches the person's department, unit or team.
  schema:
    $ref: './hr.yaml#/NativeID'

IsActive:
  name: is_active
  in: query
  required: false
  schema:
    type: boolean

HasFindings:
  name: has_findings
  in: query
  required: false
  schema:
    type: boolean

PersonID:
  name: person_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

Relation:
  name: relation
  in: query
  required: false
  description: With person_id, restrict to assignments where the person is the CHILD or the PARENT.
  schema:
    type: string
    enum: [CHILD, PARENT]

IsCurrent:
  name: is_current
  in: query
  required: false
  schema:
    type: boolean

RelationshipKind:
  name: relationship_kind
  in: query
  required: false
  schema:
    type: string
    enum: [REPORTS_TO, UNMAPPED]

OrgUnitKind:
  name: kind
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/OrgUnitKind'

FindingKind:
  name: kind
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingKind'

FindingSeverity:
  name: severity
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingSeverity'

FindingSubject:
  name: subject_type
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingSubject'

ResolutionState:
  name: state
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/ResolutionState'

HasConflict:
  name: has_conflict
  in: query
  required: false
  schema:
    type: boolean

EvidenceStrength:
  name: evidence_strength
  in: query
  required: false
  description: The strongest evidence of the case.
  schema:
    $ref: './customers.yaml#/Strength'

Strength:
  name: strength
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/Strength'

CaseReason:
  name: reason
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/CaseReason'

CustomerID:
  name: customer_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'
