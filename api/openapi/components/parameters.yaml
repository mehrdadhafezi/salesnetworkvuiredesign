CorrelationID:
  name: X-Correlation-ID
  in: header
  required: false
  description: Optional client correlation id. Invalid values are replaced by a server-generated id.
  schema:
    $ref: './schemas.yaml#/CorrelationID'

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Required on every future mutating command (Architecture V1 §23). Same key
    and same request replays the stored result; same key with a different
    request is CONFLICT.
  schema:
    type: string
    pattern: '^[A-Za-z0-9_-]{16,128}$'

IfMatch:
  name: If-Match
  in: header
  required: true
  description: Aggregate version (ETag) for optimistic concurrency on versioned mutations; mismatch is CONFLICT.
  schema:
    type: string
    maxLength: 128

Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor from PageInfo.next_cursor.
  schema:
    type: string
    maxLength: 512

Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50

Query:
  name: q
  in: query
  required: false
  description: Case-insensitive substring of the display name (persons also match the employee code).
  schema:
    type: string
    minLength: 1
    maxLength: 100

Presence:
  name: presence
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/Presence'

UserSort:
  name: sort
  in: query
  required: false
  description: Allowlisted sort; a leading "-" is descending.
  schema:
    type: string
    enum: [display_name, -display_name]
    default: display_name

PersonSort:
  name: sort
  in: query
  required: false
  description: Allowlisted sort; a leading "-" is descending.
  schema:
    type: string
    enum: [display_name, -display_name, employee_code, -employee_code, employment_status, -employment_status]
    default: display_name

EmploymentStatus:
  name: employment_status
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/EmploymentStatus'

PositionID:
  name: position_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

LevelID:
  name: level_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

OrgUnitID:
  name: org_unit_id
  in: query
  required: false
  description: Matches the person's department, unit or team.
  schema:
    $ref: './hr.yaml#/NativeID'

IsActive:
  name: is_active
  in: query
  required: false
  schema:
    type: boolean

HasFindings:
  name: has_findings
  in: query
  required: false
  schema:
    type: boolean

PersonID:
  name: person_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

Relation:
  name: relation
  in: query
  required: false
  description: With person_id, restrict to assignments where the person is the CHILD or the PARENT.
  schema:
    type: string
    enum: [CHILD, PARENT]

IsCurrent:
  name: is_current
  in: query
  required: false
  schema:
    type: boolean

RelationshipKind:
  name: relationship_kind
  in: query
  required: false
  schema:
    type: string
    enum: [REPORTS_TO, UNMAPPED]

OrgUnitKind:
  name: kind
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/OrgUnitKind'

FindingKind:
  name: kind
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingKind'

FindingSeverity:
  name: severity
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingSeverity'

FindingSubject:
  name: subject_type
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/FindingSubject'

ResolutionState:
  name: state
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/ResolutionState'

HasConflict:
  name: has_conflict
  in: query
  required: false
  schema:
    type: boolean

EvidenceStrength:
  name: evidence_strength
  in: query
  required: false
  description: The strongest evidence of the case.
  schema:
    $ref: './customers.yaml#/Strength'

Strength:
  name: strength
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/Strength'

CaseReason:
  name: reason
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/CaseReason'

CustomerID:
  name: customer_id
  in: query
  required: false
  schema:
    $ref: './hr.yaml#/NativeID'

WorkflowType:
  name: workflow_type
  in: query
  required: false
  schema:
    $ref: './sales.yaml#/WorkflowType'

StateMapping:
  name: state_mapping
  in: query
  required: false
  schema:
    $ref: './sales.yaml#/StateMapping'

CustomerLinkState:
  name: customer_link_state
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/ResolutionState'

Parity:
  name: parity
  in: query
  required: false
  schema:
    $ref: './sales.yaml#/Parity'

Derivation:
  name: derivation
  in: query
  required: false
  schema:
    $ref: './sales.yaml#/Derivation'

CaseID:
  name: case_id
  in: path
  required: true
  schema:
    $ref: './hr.yaml#/NativeID'

InvoiceID:
  name: invoice_id
  in: path
  required: true
  schema:
    $ref: './hr.yaml#/NativeID'

AttemptID:
  name: attempt_id
  in: path
  required: true
  schema:
    $ref: './hr.yaml#/NativeID'

ReceiptID:
  name: receipt_id
  in: path
  required: true
  schema:
    $ref: './hr.yaml#/NativeID'

CaseLinkState:
  name: case_link_state
  in: query
  required: false
  schema:
    $ref: './customers.yaml#/ResolutionState'

HasUnknownStatus:
  name: has_unknown_status
  in: query
  required: false
  description: Invoices with (true) / without (false) any UNKNOWN raw invoice or stage state.
  schema:
    type: boolean

PaymentChannel:
  name: channel
  in: query
  required: false
  schema:
    $ref: './billing.yaml#/PaymentChannel'

TargetMapping:
  name: state_mapping
  in: query
  required: false
  schema:
    $ref: './billing.yaml#/TargetMapping'

AttemptState:
  name: state
  in: query
  required: false
  schema:
    $ref: './billing.yaml#/AttemptState'

ApprovalProvenance:
  name: approval_provenance
  in: query
  required: false
  schema:
    $ref: './billing.yaml#/ApprovalProvenance'

InvoiceLinkState:
  name: invoice_link_state
  in: query
  required: false
  schema:
    type: string
    enum: [RESOLVED, UNKNOWN]

MetricID:
  name: metric_id
  in: path
  required: true
  schema:
    type: string
    pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
    maxLength: 80

ReportTimeBasis:
  name: time_basis
  in: query
  required: false
  schema:
    $ref: './reporting.yaml#/ReportTimeBasis'

RangeFrom:
  name: from
  in: query
  required: false
  description: EVENT_RANGE start (inclusive, RFC 3339 UTC).
  schema:
    $ref: './schemas.yaml#/Timestamp'

RangeTo:
  name: to
  in: query
  required: false
  description: EVENT_RANGE end (exclusive, RFC 3339 UTC).
  schema:
    $ref: './schemas.yaml#/Timestamp'

AsOf:
  name: as_of
  in: query
  required: false
  description: HISTORICAL_AS_OF instant (RFC 3339 UTC).
  schema:
    $ref: './schemas.yaml#/Timestamp'

RunID:
  name: run_id
  in: query
  required: false
  description: Pin the projection run (cutoff) to reproduce an answer.
  schema:
    $ref: './hr.yaml#/NativeID'

ReportScope:
  name: scope
  in: query
  required: false
  description: Part of the query contract; only ORGANIZATION has frozen authority (never broadened by a client).
  schema:
    type: string
    enum: [ORGANIZATION]

OriginalOwnerResolution:
  name: original_owner_resolution
  in: query
  required: false
  schema:
    type: string
    enum: [RESOLVED, RELATED, UNKNOWN, CONFLICT, NOT_RECOVERABLE, NOT_CAPTURED]

MainMapping:
  name: main_mapping
  in: query
  required: false
  schema:
    type: string
    enum: [KNOWN_VOCABULARY, UNKNOWN, EMPTY]

TotalClass:
  name: total_class
  in: query
  required: false
  schema:
    $ref: './billing.yaml#/TotalClass'

InvoiceUnit:
  name: unit
  in: query
  required: false
  schema:
    type: string
    enum: [IRT, IRR, UNATTRIBUTED]

PaymentUnit:
  name: unit
  in: query
  required: false
  schema:
    type: string
    enum: [IRT, IRR, NONE]

ReportAttemptState:
  name: state
  in: query
  required: false
  description: Explicit attempt state, or UNMAPPED when the raw state has no verified mapping.
  schema:
    type: string
    enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, RECONCILIATION_REQUIRED, UNMAPPED]

# --- Slice 9 finance shadow ledger (server-validated; no free query) ---------

FinanceRunID:
  name: run_id
  in: query
  required: false
  description: Pin the shadow run (source cutoff + snapshot). Omitted = the latest run; the answer names the run it used.
  schema:
    type: string
    format: uuid

ShadowBasis:
  name: basis
  in: query
  required: false
  schema:
    $ref: './finance.yaml#/ShadowBasis'

FinanceUnit:
  name: unit
  in: query
  required: false
  schema:
    $ref: './schemas.yaml#/Unit'

ReconciliationUnit:
  name: unit
  in: query
  required: false
  schema:
    type: string
    enum: [IRR, IRT, UNKNOWN]

ReconciliationState:
  name: state
  in: query
  required: false
  schema:
    $ref: './finance.yaml#/ReconciliationState'

BalanceState:
  name: state
  in: query
  required: false
  description: The legacy comparison state of the balance, or NOT_COMPARABLE when no legacy figure exists.
  schema:
    type: string
    enum: [MATCH, MISMATCH, UNKNOWN, INCOMPLETE, CONFLICT, NOT_RECOVERABLE, NOT_COMPARABLE]

EntryState:
  name: state
  in: query
  required: false
  schema:
    type: string
    enum: [CONSISTENT, CONFLICT, UNRESOLVED_CORRECTION]

SourceType:
  name: source_type
  in: query
  required: false
  schema:
    type: string
    enum: [billing.invoice, payments.attempt, legacy.wallet_transaction]

AccountCategory:
  name: account_category
  in: query
  required: false
  schema:
    type: string
    enum: [customer_receivable, revenue_by_product_kind, cash_bank_clearing, commission_payable, legacy_wallet_unclassified, legacy_wallet_contra]

SubjectType:
  name: subject_type
  in: query
  required: false
  schema:
    type: string
    enum: [legacy_wallet, invoice]

EffectiveFrom:
  name: effective_from
  in: query
  required: false
  description: Entries whose evidenced effective time is at or after (UTC). Entries with an unknown effective time never match a date range.
  schema:
    $ref: './schemas.yaml#/Timestamp'

EffectiveTo:
  name: effective_to
  in: query
  required: false
  description: Entries whose evidenced effective time is before (UTC).
  schema:
    $ref: './schemas.yaml#/Timestamp'
