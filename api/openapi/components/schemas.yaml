Outcome:
  type: string
  description: |
    The seven frozen Slice 0 result outcomes (E0 §9A). UNKNOWN is never
    FAILED; PARTIAL is never SUCCESS; CONFLICT is not FAILED; UNAUTHORIZED is
    distinct from BLOCKED.
  enum: [SUCCESS, PARTIAL, FAILED, UNKNOWN, CONFLICT, BLOCKED, UNAUTHORIZED]

ReasonCode:
  type: string
  description: foundation-v1 CRM reason codes (Phase-0 spec §6; kernel/reasoncodes).
  enum:
    - DEPENDENCY_FINANCIAL_ACTIVE
    - DEPENDENCY_PROTECTED_DOWNSTREAM
    - DEPENDENCY_UNKNOWN
    - LINKAGE_CONFLICT
    - STALE_STATE
    - ROW_SCOPE_DENIED
    - ACTION_DENIED
    - FIELD_DENIED
    - RECIPIENT_INELIGIBLE
    - OUTCOME_UNKNOWN
    - SOURCE_UNAVAILABLE
    - COVERAGE_INCOMPLETE
    - POLICY_UNRESOLVED
    - FEATURE_DISABLED
    - CONTRACT_INVALID

CorrelationID:
  type: string
  description: Opaque request correlation identifier.
  pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
  minLength: 8
  maxLength: 128

Timestamp:
  type: string
  format: date-time
  description: RFC 3339 instant in UTC (suffix Z). Jalali is presentation only.
  pattern: 'Z$'

Unit:
  type: string
  description: Explicit monetary unit. IRR and IRT are distinct; there is no conversion.
  enum: [IRR, IRT]

Money:
  type: object
  description: |
    Exact signed int64 amount in an explicit unit (E0 §9D). The amount is a
    decimal string so that no client parses it as a floating-point number.
  required: [amount, unit]
  additionalProperties: false
  properties:
    amount:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      maxLength: 20
    unit:
      $ref: '#/Unit'

NativeRef:
  type: object
  description: Domain-qualified native identifier (kernel/refs). Never a phone number.
  required: [domain, id]
  additionalProperties: false
  properties:
    domain:
      type: string
      enum: [LEGACY_LEAD, V4_DISTRIBUTION, MIS_ROW, MIS_POOL, DOT_CASE, INVOICE, PAYMENT_STAGE, PAYMENT, LEDGER_TX, EVENT]
    id:
      type: string
      pattern: '^[1-9][0-9]{0,19}$'

ItemOutcome:
  type: object
  description: Per-item outcome inside a ResultEnvelope; per-item classes are preserved.
  required: [outcome, reasons]
  additionalProperties: false
  properties:
    item_ref:
      $ref: '#/NativeRef'
    outcome:
      $ref: '#/Outcome'
    reasons:
      type: array
      maxItems: 15
      items:
        $ref: '#/ReasonCode'
    message:
      type: string
      maxLength: 500

ResultEnvelope:
  type: object
  description: |
    Generic business result (Architecture V1 §23). Concrete envelopes add a
    typed data property. An item-level mix aggregates to PARTIAL.
  required: [outcome, reasons, correlation_id]
  properties:
    outcome:
      $ref: '#/Outcome'
    items:
      type: array
      maxItems: 1000
      items:
        $ref: '#/ItemOutcome'
    reasons:
      type: array
      maxItems: 15
      items:
        $ref: '#/ReasonCode'
    correlation_id:
      $ref: '#/CorrelationID'
    audit_id:
      type: string
      format: uuid
      description: Present for sensitive commands (future slices).

FieldError:
  type: object
  required: [path, reason_code]
  additionalProperties: false
  properties:
    path:
      type: string
      maxLength: 256
      description: JSON pointer-like path of the offending field, e.g. "/amount".
    reason_code:
      $ref: '#/ReasonCode'
    message:
      type: string
      maxLength: 500

Problem:
  type: object
  description: RFC 9457 problem details with a foundation-v1 reason_code.
  required: [type, title, status, reason_code, correlation_id]
  properties:
    type:
      type: string
      format: uri-reference
      maxLength: 256
    title:
      type: string
      maxLength: 200
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
      maxLength: 1000
    instance:
      type: string
      format: uri-reference
      maxLength: 512
    reason_code:
      $ref: '#/ReasonCode'
    correlation_id:
      $ref: '#/CorrelationID'
    errors:
      type: array
      maxItems: 100
      items:
        $ref: '#/FieldError'

PageInfo:
  type: object
  description: |
    Cursor pagination state. There is deliberately no total: a total is
    returned only when it is part of a metric contract.
  required: [has_more]
  additionalProperties: false
  properties:
    next_cursor:
      type: string
      maxLength: 512
      nullable: true
    has_more:
      type: boolean

AllowedAction:
  type: object
  required: [allowed]
  additionalProperties: false
  properties:
    allowed:
      type: boolean
    reason_code:
      $ref: '#/ReasonCode'

AllowedActions:
  type: object
  description: |
    Server-authoritative permission hints keyed by action name. Clients may
    render them; they never infer permission from roles, hierarchy or routes.
  additionalProperties:
    $ref: '#/AllowedAction'

HealthLive:
  type: object
  required: [status]
  additionalProperties: false
  properties:
    status:
      type: string
      enum: [live]

HealthReady:
  type: object
  required: [status, checks]
  additionalProperties: false
  properties:
    status:
      type: string
      enum: [ready, not_ready]
    checks:
      type: array
      maxItems: 32
      items:
        type: object
        required: [name, status]
        additionalProperties: false
        properties:
          name:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
          status:
            type: string
            enum: [ok, failing]

SessionContext:
  type: object
  required: [authenticated, auth_mode, server_time, display_zone]
  additionalProperties: false
  properties:
    authenticated:
      type: boolean
    auth_mode:
      type: string
      description: dev_stub only in development/test; none in production (Slice 2 has no production auth).
      enum: [dev_stub, none]
    principal:
      type: object
      required: [principal_id, display_name, synthetic]
      additionalProperties: false
      properties:
        principal_id:
          type: string
          pattern: '^dev-user-[0-9]{3}$'
        display_name:
          type: string
          maxLength: 64
        synthetic:
          type: boolean
          enum: [true]
    capability_hints:
      type: array
      description: Synthetic display-only hints. Never authoritative permissions.
      maxItems: 32
      items:
        type: string
        pattern: '^dev\.[a-z][a-z0-9_.]{1,63}$'
    server_time:
      $ref: '#/Timestamp'
    display_zone:
      type: string
      description: Presentation default zone (IANA). Not storage truth.
      enum: [Asia/Tehran]
    features:
      type: object
      description: |
        Server feature switches for navigation only (Slice 4 rollback is
        flag-off). Never authority: every read is evaluated by the server.
      required: [hr_read, customers_identity, sales_read]
      additionalProperties: false
      properties:
        hr_read:
          type: boolean
        customers_identity:
          type: boolean
          description: Slice 5 customer identity shadow read (flag customers.identity_shadow_read).
        sales_read:
          type: boolean
          description: Slice 6 sales read shadow (flag sales.read_shadow).

SessionEnvelope:
  type: object
  required: [outcome, reasons, correlation_id, data]
  additionalProperties: false
  properties:
    outcome:
      $ref: '#/Outcome'
    reasons:
      type: array
      maxItems: 15
      items:
        $ref: '#/ReasonCode'
    correlation_id:
      $ref: '#/CorrelationID'
    data:
      $ref: '#/SessionContext'
