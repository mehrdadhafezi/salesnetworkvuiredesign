# Slice 9 finance SHADOW ledger read (GET only; no posting, approval,
# reversal, settlement, refund, credit or debit operation exists).
# Everything here is a SHADOW fact: not the financial system of record, not
# settled, bank-confirmed or Finance-approved money, not an official or
# accounting balance. Every answer is pinned to one shadow run (source
# cutoff + snapshot). Accrual and cash are separate bases (D-41 open: none is
# canonical). IRR and IRT are never combined or converted (OPD-06 open). A
# value that cannot be evaluated is null with an explicit state — never zero.

ShadowNotice:
  type: string
  description: Fixed SHADOW notice repeated on every finance answer.
  enum: ['SHADOW: derived for architecture validation and reconciliation only. Not the financial system of record; not settled, bank-confirmed or Finance-approved money; not an official or accounting balance.']

RecordKind:
  type: string
  enum: [SHADOW]

ShadowBasis:
  type: string
  description: |
    ACCRUAL_SHADOW and CASH_SHADOW are computed side by side (D-41 unresolved: neither is canonical, preferred or final).
    WALLET_MIRROR_SHADOW mirrors legacy wallet postings (neither accrual nor cash).
  enum: [ACCRUAL_SHADOW, CASH_SHADOW, WALLET_MIRROR_SHADOW]

FinanceCoverage:
  type: string
  enum: [AVAILABLE, PARTIAL, MISSING, UNKNOWN, NOT_RECOVERABLE, STALE]

FinanceFreshness:
  type: string
  description: FRESH / STALE against a 24h SLA; UNKNOWN when no time is known.
  enum: [FRESH, STALE, UNKNOWN]

ReconciliationState:
  type: string
  enum: [MATCH, MISMATCH, UNKNOWN, INCOMPLETE, CONFLICT, NOT_RECOVERABLE]

AmountState:
  type: string
  description: REPRESENTABLE = exact int64 value given; OVERFLOW = the int64 sum overflowed and no value is claimed.
  enum: [REPRESENTABLE, OVERFLOW]

ShadowAmount:
  type: object
  description: An exact shadow amount in its unit, or no money with OVERFLOW (never zero for unknown).
  required: [state]
  additionalProperties: false
  properties:
    money: {$ref: './schemas.yaml#/Money'}
    state: {$ref: '#/AmountState'}

FinanceRunSource:
  type: object
  required: [source, status, read_at, reason, freshness]
  additionalProperties: false
  properties:
    source: {type: string, enum: [billing, payments, legacy_wallets, legacy_wallet_transactions]}
    status: {$ref: '#/FinanceCoverage'}
    rows_read:
      type: integer
      format: int64
      nullable: true
    snapshot_id:
      type: string
      maxLength: 128
      nullable: true
    source_cutoff: {$ref: './schemas.yaml#/Timestamp'}
    read_at: {$ref: './schemas.yaml#/Timestamp'}
    reason: {type: string, maxLength: 300}
    freshness: {$ref: '#/FinanceFreshness'}

ShadowRun:
  type: object
  required: [record_kind, run_id, run_seq, derivation_version, bases, source_cutoff, started_at, completed_at, outcome, reasons,
    fact_counts, facts_sha256, sources, freshness]
  additionalProperties: false
  properties:
    record_kind: {$ref: '#/RecordKind'}
    run_id: {type: string, format: uuid}
    run_seq:
      type: integer
      format: int64
    derivation_version: {type: integer}
    bases:
      type: array
      maxItems: 3
      items: {$ref: '#/ShadowBasis'}
    source_cutoff: {$ref: './schemas.yaml#/Timestamp'}
    started_at: {$ref: './schemas.yaml#/Timestamp'}
    completed_at: {$ref: './schemas.yaml#/Timestamp'}
    outcome:
      type: string
      description: Technical run outcome only (PARTIAL when any required source is not AVAILABLE). Never a financial reconciliation result.
      enum: [SUCCESS, PARTIAL]
    reasons: {$ref: './hr.yaml#/Reasons'}
    fact_counts:
      type: object
      additionalProperties:
        type: integer
        format: int64
    facts_sha256: {type: string, maxLength: 64}
    sources:
      type: array
      maxItems: 8
      items: {$ref: '#/FinanceRunSource'}
    freshness: {$ref: '#/FinanceFreshness'}

GroupCount:
  type: object
  required: [count]
  additionalProperties: false
  properties:
    basis: {type: string, maxLength: 40}
    unit: {type: string, maxLength: 10}
    state: {type: string, maxLength: 40}
    reason: {type: string, maxLength: 60}
    count:
      type: integer
      format: int64

FinanceQuery:
  type: object
  description: The normalised query; run_id is the run every part of the answer comes from.
  required: [run_id, filters]
  additionalProperties: false
  properties:
    run_id: {type: string, format: uuid}
    filters:
      type: object
      additionalProperties: {type: string, maxLength: 40}

FinanceMeta:
  type: object
  required: [record_kind, notice, query, run]
  additionalProperties: false
  properties:
    record_kind: {$ref: '#/RecordKind'}
    notice: {$ref: '#/ShadowNotice'}
    query: {$ref: '#/FinanceQuery'}
    run: {$ref: '#/ShadowRun'}

LedgerAccount:
  type: object
  description: |
    Identity is a category plus a stable target / native reference (never a phone, name or email). customer_id is set only
    when the customer link is RESOLVED; an unresolved link stays explicit.
  required: [account_id, account_key, category, normal_side, subject_domain, subject_ref]
  additionalProperties: false
  properties:
    account_id: {type: string, format: uuid}
    account_key: {type: string, maxLength: 200}
    category:
      type: string
      enum: [customer_receivable, revenue_by_product_kind, cash_bank_clearing, commission_payable, legacy_wallet_unclassified, legacy_wallet_contra]
    normal_side: {type: string, enum: [DEBIT, CREDIT]}
    subject_domain: {type: string, maxLength: 40}
    subject_ref: {type: string, maxLength: 100}
    customer_link:
      type: string
      enum: [RESOLVED, RELATED, UNKNOWN, CONFLICT, NOT_RECOVERABLE]
      nullable: true
    customer_id:
      type: string
      format: uuid
      nullable: true
    holder_key:
      type: string
      maxLength: 40
      nullable: true
    holder_user_id:
      type: string
      format: uuid
      nullable: true
    wallet_type_raw:
      type: string
      maxLength: 40
      nullable: true
    provenance:
      type: string
      maxLength: 40
      nullable: true
    route:
      type: string
      maxLength: 40
      nullable: true

ReconciliationRow:
  type: object
  description: |
    One legacy figure vs one shadow amount for one subject, basis and unit in one run. difference = shadow - legacy and is
    present only for MATCH / MISMATCH / a complete CONFLICT. Units are never compared across.
  required: [subject_domain, subject_ref, basis, unit, legacy_figure, legacy_repr, state, reasons, coverage]
  additionalProperties: false
  properties:
    subject_domain: {type: string, enum: [legacy_wallet, invoice]}
    subject_ref: {type: string, maxLength: 100}
    account_id:
      type: string
      format: uuid
      nullable: true
    basis: {$ref: '#/ShadowBasis'}
    unit: {type: string, enum: [IRR, IRT, UNKNOWN]}
    legacy_figure: {type: string, enum: [WALLET_BALANCE, INVOICE_REMAINING, INVOICE_PAID]}
    legacy_raw:
      type: string
      maxLength: 40
      nullable: true
    legacy_amount: {$ref: './schemas.yaml#/Money'}
    legacy_repr: {type: string, enum: [REPRESENTABLE, UNREPRESENTABLE, ABSENT, OTHER_UNIT]}
    shadow_amount: {$ref: './schemas.yaml#/Money'}
    difference: {$ref: './schemas.yaml#/Money'}
    state: {$ref: '#/ReconciliationState'}
    reasons:
      type: array
      maxItems: 20
      items: {type: string, maxLength: 60}
    coverage: {$ref: '#/FinanceCoverage'}
    source_snapshot:
      type: string
      maxLength: 128
      nullable: true

AccountBalance:
  type: object
  description: Derived from ledger lines at read time (never stored); one account, basis and unit. No combined total exists.
  required: [account, basis, unit, debits, credits, net, lines]
  additionalProperties: false
  properties:
    account: {$ref: '#/LedgerAccount'}
    basis: {$ref: '#/ShadowBasis'}
    unit: {$ref: './schemas.yaml#/Unit'}
    debits: {$ref: '#/ShadowAmount'}
    credits: {$ref: '#/ShadowAmount'}
    net: {$ref: '#/ShadowAmount'}
    lines:
      type: integer
      format: int64
    legacy: {$ref: '#/ReconciliationRow'}

SourceRef:
  type: object
  required: [domain, ref, role]
  additionalProperties: false
  properties:
    domain: {type: string, maxLength: 60}
    ref: {type: string, maxLength: 100}
    role: {type: string, maxLength: 40}

LedgerLine:
  type: object
  required: [line_no, account_id, account_key, category, side, amount]
  additionalProperties: false
  properties:
    line_no: {type: integer}
    account_id: {type: string, format: uuid}
    account_key: {type: string, maxLength: 200}
    category: {type: string, maxLength: 40}
    side: {type: string, enum: [DEBIT, CREDIT]}
    amount: {$ref: './schemas.yaml#/Money'}
    source_ref:
      type: string
      maxLength: 100
      nullable: true

LedgerEntry:
  type: object
  description: |
    One balanced, single-unit SHADOW entry (debits == credits). Corrections are separate entries linked by
    reverses_entry_id; the original never changes. effective_at / posted_at are absent when no UTC business time is
    evidenced (never an import time); source_time_raw keeps the legacy text with its zone unasserted.
  required: [record_kind, entry_id, entry_seq, business_key, basis, unit, effect_kind, provenance, finance_review, source_refs,
    time_evidence, reconciliation_status, lines, debits, credits]
  additionalProperties: false
  properties:
    record_kind: {$ref: '#/RecordKind'}
    entry_id: {type: string, format: uuid}
    entry_seq:
      type: integer
      format: int64
    business_key: {type: string, maxLength: 300}
    basis: {$ref: '#/ShadowBasis'}
    unit: {$ref: './schemas.yaml#/Unit'}
    effect_kind: {type: string, maxLength: 60}
    provenance:
      type: string
      maxLength: 60
      description: Evidence provenance (e.g. GATEWAY_AUTO stays GATEWAY_AUTO). Never FINANCE_REVIEWED in Slice 9.
    finance_review: {type: string, enum: [NOT_FINANCE_REVIEWED]}
    source_refs:
      type: array
      maxItems: 10
      items: {$ref: '#/SourceRef'}
    effective_at: {$ref: './schemas.yaml#/Timestamp'}
    posted_at: {$ref: './schemas.yaml#/Timestamp'}
    source_time_raw:
      type: string
      maxLength: 40
      nullable: true
    time_evidence: {type: string, enum: [BUSINESS_TIME_ABSENT, SOURCE_TIME_ZONE_UNASSERTED, SOURCE_TIME_UTC]}
    reverses_entry_id:
      type: string
      format: uuid
      nullable: true
    reversed_by_entry_id:
      type: string
      format: uuid
      nullable: true
    reconciliation_status: {type: string, enum: [CONSISTENT, CONFLICT, UNRESOLVED_CORRECTION]}
    lines:
      type: array
      maxItems: 20
      items: {$ref: '#/LedgerLine'}
    debits: {$ref: './schemas.yaml#/Money'}
    credits: {$ref: './schemas.yaml#/Money'}

LedgerGroup:
  type: object
  required: [basis, unit, entries, debits, unknown_effective_at]
  additionalProperties: false
  properties:
    basis: {$ref: '#/ShadowBasis'}
    unit: {$ref: './schemas.yaml#/Unit'}
    entries:
      type: integer
      format: int64
    debits: {$ref: '#/ShadowAmount'}
    unknown_effective_at:
      type: integer
      format: int64

ShadowRunListEnvelope:
  type: object
  required: [outcome, reasons, correlation_id, notice]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    notice: {$ref: '#/ShadowNotice'}
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/ShadowRun'}
    page: {$ref: './schemas.yaml#/PageInfo'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

ShadowRunEnvelope:
  type: object
  required: [outcome, reasons, correlation_id, notice]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    notice: {$ref: '#/ShadowNotice'}
    run: {$ref: '#/ShadowRun'}
    reconciliation_summary:
      type: array
      maxItems: 200
      items: {$ref: '#/GroupCount'}
    finding_summary:
      type: array
      maxItems: 200
      items: {$ref: '#/GroupCount'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

AccountListEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    summary:
      type: array
      maxItems: 20
      items: {$ref: '#/GroupCount'}
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/LedgerAccount'}
    page: {$ref: './schemas.yaml#/PageInfo'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

AccountEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    account: {$ref: '#/LedgerAccount'}
    balances:
      type: array
      maxItems: 20
      items: {$ref: '#/AccountBalance'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

BalanceListEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    summary:
      type: array
      maxItems: 200
      items: {$ref: '#/GroupCount'}
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/AccountBalance'}
    page: {$ref: './schemas.yaml#/PageInfo'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

LedgerListEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    summary:
      type: array
      maxItems: 20
      items: {$ref: '#/LedgerGroup'}
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/LedgerEntry'}
    page: {$ref: './schemas.yaml#/PageInfo'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

LedgerEntryEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    entry: {$ref: '#/LedgerEntry'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}

ReconciliationListEnvelope:
  type: object
  required: [outcome, reasons, correlation_id]
  additionalProperties: false
  properties:
    outcome: {$ref: './schemas.yaml#/Outcome'}
    reasons: {$ref: './hr.yaml#/Reasons'}
    correlation_id: {$ref: './schemas.yaml#/CorrelationID'}
    meta: {$ref: '#/FinanceMeta'}
    summary:
      type: array
      maxItems: 200
      items: {$ref: '#/GroupCount'}
    items:
      type: array
      maxItems: 200
      items: {$ref: '#/ReconciliationRow'}
    page: {$ref: './schemas.yaml#/PageInfo'}
    allowed_actions: {$ref: './schemas.yaml#/AllowedActions'}
