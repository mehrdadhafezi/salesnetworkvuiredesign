  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List shadow customers
      description: |
        Requires customers.customer.read. One customer per source subject; never merged.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/ResolutionState'
        - $ref: './components/parameters.yaml#/HasConflict'
        - $ref: './components/parameters.yaml#/Presence'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
