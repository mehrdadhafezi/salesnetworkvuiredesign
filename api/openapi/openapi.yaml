        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/authorization/effective-access:
    get:
      tags: [authorization]
      operationId: getEffectiveAccess
      summary: Effective access of the current principal
      description: |
        Evaluates every Slice 4 capability for the caller with the same
        evaluator that produces allowed_actions. Anonymous callers receive
        an all-denied evaluation. Read-only.
      responses:
        '200':
          description: Evaluation (always returned; denial is data here, not an error).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/EffectiveAccessEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List shadow customers
      description: |
        Requires customers.customer.read. One customer per source subject; never merged.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/ResolutionState'
        - $ref: './components/parameters.yaml#/HasConflict'
        - $ref: './components/parameters.yaml#/Presence'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/customers.yaml#/CustomerListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/customers/{customer_id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get one shadow customer
      description: |
        Requires customers.customer.read.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            $ref: './components/hr.yaml#/NativeID'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/customers.yaml#/CustomerEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/customers/{customer_id}/contact-points:
    get:
      tags: [customers]
      operationId: listCustomerContactPoints
      summary: List a customer's masked contact points
      description: |
        Requires customers.customer.read. Values are masked; equal phones are ambiguity, never identity.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            $ref: './components/hr.yaml#/NativeID'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/customers.yaml#/ContactPointListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/customers/{customer_id}/evidence:
    get:
      tags: [customers]
      operationId: listCustomerEvidence
      summary: List identity evidence about a customer
      description: |
        Requires customers.customer.read.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            $ref: './components/hr.yaml#/NativeID'
        - $ref: './components/parameters.yaml#/Strength'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/customers.yaml#/EvidenceListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
