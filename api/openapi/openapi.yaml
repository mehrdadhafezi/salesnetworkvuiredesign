  /api/v1/customer-identity/merge-cases:
    get:
      tags: [customers]
      operationId: listMergeCases
      summary: Merge-case candidate queue (read only)
      description: |
        Requires customers.merge_case.read. No merge, resolve or winner selection exists (D-30 open).
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/ResolutionState'
        - $ref: './components/parameters.yaml#/EvidenceStrength'
        - $ref: './components/parameters.yaml#/CaseReason'
        - $ref: './components/parameters.yaml#/CustomerID'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/customers.yaml#/MergeCaseListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/customer-identity/merge-cases/{merge_case_id}:
    get:
      tags: [customers]
      operationId: getMergeCase
      summary: Get one merge-case candidate
      description: |
        Requires customers.merge_case.read.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      parameters:
        - name: merge_case_id
          in: path
          required: true
