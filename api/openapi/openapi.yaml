    get:
      tags: [authorization]
      operationId: getEffectiveAccess
      summary: Effective access of the current principal
      description: |
        Evaluates every Slice 4 capability for the caller with the same
        evaluator that produces allowed_actions. Anonymous callers receive
        an all-denied evaluation. Read-only.
      responses:
        '200':
          description: Evaluation (always returned; denial is data here, not an error).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/EffectiveAccessEnvelope'
        '400':
