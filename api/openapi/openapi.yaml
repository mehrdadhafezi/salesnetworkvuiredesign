  /api/v1/organization/org-units:
    get:
      tags: [organization]
      operationId: listOrganizationOrgUnits
      summary: List org units (one typed tree)
      description: |
        Requires org.unit.read. Ordered departments, units, teams. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/OrgUnitKind'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
