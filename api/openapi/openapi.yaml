  /api/v1/customer-identity/resolution-report:
    get:
      tags: [customers]
      operationId: getCustomerResolutionReport
      summary: Customer identity resolution report
      description: |
        Requires customers.identity_report.read. Includes the invariants phone_only_resolved_count = 0 and merge_count = 0.
        Read-only (READ ONLY transaction); unknown query parameters are 400 CONTRACT_INVALID.
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 5 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
