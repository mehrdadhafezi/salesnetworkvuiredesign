openapi: 3.0.3
info:
  title: CRM target API
  version: 0.2.0
  description: |
    Authoritative HTTP contract of the standalone CRM (Architecture V1 §23).
    Slice 2 exposes technical health and a development session surface.
    Slice 4 adds READ-ONLY identity / organization / authorization surfaces
    over the shadow read model (no write operation exists). Reusable
    components define the conventions future slices must use.

    Conventions:
    - Business outcomes use the ResultEnvelope with the seven frozen outcomes.
      HTTP 2xx is never business SUCCESS by itself: SUCCESS, PARTIAL, FAILED,
      UNKNOWN and BLOCKED are returned with 200; CONFLICT with 409;
      UNAUTHORIZED with 403.
    - Transport, contract and server errors use RFC 9457 application/problem+json
      with a foundation-v1 reason_code.
    - Every response carries X-Correlation-ID; a valid inbound value is kept,
      otherwise one is generated.
    - Timestamps are RFC 3339 UTC. Money is {amount: string-int64, unit: IRR|IRT}.
  license:
    name: Proprietary
    url: https://github.com/mehrdadhafezi/salesnetworkvuiredesign
servers:
  - url: /
security: []
tags:
  - name: health
    description: Technical liveness/readiness. Not business outcomes.
  - name: session
    description: Session context for the SPA shell.
  - name: identity
    description: Slice 4 read-only shadow identity model (no authentication).
  - name: organization
    description: Slice 4 read-only shadow organization model (HR read).
  - name: authorization
    description: Slice 4 read evaluator (server-authoritative effective access).
  - name: customers
    description: Slice 5 customer identity shadow model and merge-case queue (read only; no merge).
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness
      description: The process is running. Technical status, not a ResultEnvelope.
      responses:
        '200':
          description: Live.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthLive'
        default:
          $ref: './components/responses.yaml#/Problem'
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness
      description: |
        Whether the process can serve traffic. Slice 2 has no dependencies, so
        the check list is empty. Never exposes DSNs, credentials or internals.
      responses:
        '200':
          description: Ready.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthReady'
        '503':
          description: Not ready.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthReady'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Current session context
      description: |
        Who the caller is, for shell display only. In Slice 2 the only
        authentication source is the DEV/TEST stub; in production mode the
        stub cannot be enabled and the session is always unauthenticated.
        Capabilities here are synthetic display hints, never authority.
      responses:
        '200':
          description: Session context (authenticated or not).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/SessionEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/identity/users:
    get:
      tags: [identity]
      operationId: listIdentityUsers
      summary: List shadow user accounts
      description: |
        Requires identity.user.read. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/Query'
        - $ref: './components/parameters.yaml#/Presence'
        - $ref: './components/parameters.yaml#/UserSort'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/UserListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/identity/users/{user_id}:
    get:
      tags: [identity]
      operationId: getIdentityUser
      summary: Get one shadow user account
      description: |
        Requires identity.user.read. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: './components/hr.yaml#/NativeID'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/UserEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/organization/persons:
    get:
      tags: [organization]
      operationId: listOrganizationPersons
      summary: List persons (HR workforce)
      description: |
        Requires org.person.read; employment, structure and manager context are field-masked by
        org.employment.read, org.position.read, org.unit.read and org.assignment.read. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/Query'
        - $ref: './components/parameters.yaml#/EmploymentStatus'
        - $ref: './components/parameters.yaml#/PositionID'
        - $ref: './components/parameters.yaml#/LevelID'
        - $ref: './components/parameters.yaml#/OrgUnitID'
        - $ref: './components/parameters.yaml#/IsActive'
        - $ref: './components/parameters.yaml#/HasFindings'
        - $ref: './components/parameters.yaml#/PersonSort'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/PersonListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/organization/persons/{person_id}:
    get:
      tags: [organization]
      operationId: getOrganizationPerson
      summary: Get one person with employment, assignments, history and findings
      description: |
        Requires org.person.read; sections are field-masked per capability. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            $ref: './components/hr.yaml#/NativeID'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/PersonEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/organization/positions:
    get:
      tags: [organization]
      operationId: listOrganizationPositions
      summary: List positions
      description: |
        Requires org.position.read. Positions are HR facts, never roles. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/LookupListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
