        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
components:
  parameters:
    CorrelationID:
      $ref: './components/parameters.yaml#/CorrelationID'
    IdempotencyKey:
