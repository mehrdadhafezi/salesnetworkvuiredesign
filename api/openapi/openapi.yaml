        '403':
          $ref: './components/responses.yaml#/Denied'
        '404':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/organization/positions:
    get:
      tags: [organization]
      operationId: listOrganizationPositions
      summary: List positions
      description: |
        Requires org.position.read. Positions are HR facts, never roles. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
