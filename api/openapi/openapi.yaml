  /api/v1/fulfillment/work-cases/{case_id}/assignment:
    post:
      tags: [operations]
      operationId: assignFulfillmentWorkCase
      summary: "Assign the case to a current executor of the same service"
      description: |
        Requires fulfillment.work.assign; flag fulfillment.work_write (rollout SHADOW_COMPARE or CONTROLLED_WRITEBACK; off = BLOCKED / FEATURE_DISABLED).
        Idempotency-Key is required: same key + same body replays; same key + another body is 409 CONFLICT. Every check is re-evaluated at commit.
        The actor must be a CURRENT supervisor of this service; the assignee a CURRENT executor of this service. Reassigning an IN_PROGRESS case is BLOCKED (OPD-05).
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: './components/parameters.yaml#/IdempotencyKey'
        - $ref: './components/parameters.yaml#/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/work.yaml#/WorkAssignRequest'
      responses:
        '200':
          description: Command envelope (SUCCESS, BLOCKED with the blocking decision, UNKNOWN).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/work.yaml#/WorkCommandEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '404':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        '409':
          description: CONFLICT (stale version, concurrent change or idempotency key reuse).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/work.yaml#/WorkCommandEnvelope'
        default:
          $ref: './components/responses.yaml#/Problem'
