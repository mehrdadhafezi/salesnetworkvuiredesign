  /api/v1/organization/hierarchy-findings:
    get:
      tags: [organization]
      operationId: listOrganizationHierarchyFindings
      summary: List hierarchy findings
      description: |
        Requires org.assignment.read. Findings are reported, never auto-fixed. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/FindingKind'
        - $ref: './components/parameters.yaml#/FindingSeverity'
        - $ref: './components/parameters.yaml#/FindingSubject'
        - $ref: './components/parameters.yaml#/PersonID'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/FindingListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
