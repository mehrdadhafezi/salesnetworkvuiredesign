    get:
      tags: [organization]
      operationId: listOrganizationAssignments
      summary: List reporting assignments
      description: |
        Requires org.assignment.read. Interval text is raw legacy evidence (zone UNKNOWN). Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/PersonID'
        - $ref: './components/parameters.yaml#/Relation'
        - $ref: './components/parameters.yaml#/IsCurrent'
        - $ref: './components/parameters.yaml#/RelationshipKind'
        - $ref: './components/parameters.yaml#/HasFindings'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/AssignmentListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
