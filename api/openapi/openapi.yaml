openapi: 3.0.3
info:
  title: CRM target API
  version: 0.2.0
  description: |
    Authoritative HTTP contract of the standalone CRM (Architecture V1 §23).
    Slice 2 exposes technical health and a development session surface.
    Slice 4 adds READ-ONLY identity / organization / authorization surfaces
    over the shadow read model (no write operation exists). Reusable
    components define the conventions future slices must use.

    Conventions:
    - Business outcomes use the ResultEnvelope with the seven frozen outcomes.
      HTTP 2xx is never business SUCCESS by itself: SUCCESS, PARTIAL, FAILED,
      UNKNOWN and BLOCKED are returned with 200; CONFLICT with 409;
      UNAUTHORIZED with 403.
    - Transport, contract and server errors use RFC 9457 application/problem+json
      with a foundation-v1 reason_code.
    - Every response carries X-Correlation-ID; a valid inbound value is kept,
      otherwise one is generated.
    - Timestamps are RFC 3339 UTC. Money is {amount: string-int64, unit: IRR|IRT}.
  license:
    name: Proprietary
    url: https://github.com/mehrdadhafezi/salesnetworkvuiredesign
servers:
  - url: /
security: []
tags:
  - name: health
    description: Technical liveness/readiness. Not business outcomes.
  - name: session
    description: Session context for the SPA shell.
  - name: auth
    description: |
      R1 production authentication: password login against identity
      credentials, server-side sessions, logout. No enrolment, reset,
      recovery, MFA, OTP or customer login (D-34, D-26, D-42).
  - name: identity
    description: Slice 4 read-only shadow identity model (no authentication).
  - name: organization
    description: Slice 4 read-only shadow organization model (HR read).
  - name: authorization
    description: Slice 4 read evaluator (server-authoritative effective access).
  - name: customers
    description: Slice 5 customer identity shadow model and merge-case queue (read only; no merge).
  - name: sales
    description: Slice 6 sales read shadow — cases, custody events, attribution snapshots (read only; no actions).
  - name: finance
    description: Slice 9 finance SHADOW ledger read (GET only). Derived shadow journal, balances and reconciliation against legacy balances; not the financial system of record, not settled, bank-confirmed or Finance-approved money.
  - name: biawin
    description: Slice 10 Biawin subscription READ shadow and active subscription parity (GET only; no activation, provider or wallet operation).
  - name: fulfillment
    description: Slice 10 fulfillment READ shadow — service follow-up, execution, upgrade execution and shipping cases (GET only; no workflow, assignment, shipping or completion operation).
  - name: writeback
    description: Slice 11 legacy write-back diagnostics (read only; no fix action).
  - name: reporting
    description: Slice 8 MIS / reporting read — metric contracts, projections, Invoice Review query surface (read only; no export; no Invoice Review UI).
  - name: payments
    description: Slice 12 controlled financial writes — receipt upload, owning-seller manual payment batch, evidence diagnostics and the read-only Finance review queue (no review decision, posting, refund, gateway route or next stage).
  - name: operations
    description: Slice 14 controlled fulfillment and Biawin writes — per-service work cases (one per SubscriptionItem), evidenced non-financial commands, SHADOW activation decisions and the external provider operation ledger (no real activation, wallet charge, settlement or commission; no production Biawin connector).
  - name: commission
    description: Slice 13 commission controlled SHADOW read — overview, policy versions, stored shadow calculations with parity, reconciliation findings, legacy dry runs and own earnings (GET only; no calculate, approve, post, credit, settle or reverse operation).
  - name: billing
    description: Slice 7 billing + payments read shadow — invoices, lines, stages, attempts, receipt references (read only; no actions).
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness
      description: The process is running. Technical status, not a ResultEnvelope.
      responses:
        '200':
          description: Live.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthLive'
        default:
          $ref: './components/responses.yaml#/Problem'
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness
      description: |
        Whether the process can serve traffic. Slice 2 has no dependencies, so
        the check list is empty. Never exposes DSNs, credentials or internals.
      responses:
        '200':
          description: Ready.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthReady'
        '503':
          description: Not ready.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/HealthReady'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Current session context
      description: |
        Who the caller is, for shell display only. DEV/TEST: the synthetic
        stub (never in production). R1: the server-side session (identity
        only, never authority), with its CSRF token. Capabilities here are
        synthetic display hints, never authority.
      responses:
        '200':
          description: Session context (authenticated or not).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/schemas.yaml#/SessionEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginWithPassword
      summary: Log in with a password credential
      description: |
        Flag identity.session_auth (default OFF → BLOCKED / FEATURE_DISABLED).
        Verifies an identity credential (Argon2id) and issues a NEW
        server-side session in the __Host-crm_session cookie (Secure,
        HttpOnly, SameSite=Strict). A session already held is revoked
        (fixation defence). Wrong password, unknown login, disabled
        credential and absent account all answer the same 401.
        Repeated failures for one login are throttled (429). Cross-site
        requests are refused before this runs (403). The session proves
        identity only: authority comes from ACTIVE role grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/auth.yaml#/LoginRequest'
      responses:
        '200':
          description: SUCCESS with a new session, or BLOCKED / FEATURE_DISABLED (no cookie).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
            Set-Cookie:
              description: The session cookie (only on SUCCESS).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components/auth.yaml#/AuthEnvelope'
        '401':
          description: UNAUTHORIZED / ACTION_DENIED (uniform for every credential failure).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/auth.yaml#/AuthEnvelope'
        '429':
          $ref: './components/responses.yaml#/Problem'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out (revoke the current session)
      description: |
        Revokes the presented session server-side and clears the cookie.
        Idempotent: without an active session it still clears the cookie.
        Requires X-CSRF-Token when a session is presented.
      responses:
        '200':
          description: SUCCESS; the cookie is cleared.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components/auth.yaml#/AuthEnvelope'
        '403':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Revoke every session of the current user
      description: |
        Revokes every active session of the authenticated user (all devices)
        and clears the cookie. Requires an active session and X-CSRF-Token.
      responses:
        '200':
          description: SUCCESS; the cookie is cleared.
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './components/auth.yaml#/AuthEnvelope'
        '401':
          description: UNAUTHORIZED (no active session).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/auth.yaml#/AuthEnvelope'
        '403':
          $ref: './components/responses.yaml#/Problem'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/identity/users:
    get:
      tags: [identity]
      operationId: listIdentityUsers
      summary: List shadow user accounts
      description: |
        Requires identity.user.read. Read-only: runs in a READ ONLY transaction and never creates, backfills or repairs data.
        Unknown query parameters, filters or sorts are rejected with 400 CONTRACT_INVALID.
      parameters:
        - $ref: './components/parameters.yaml#/Query'
        - $ref: './components/parameters.yaml#/Presence'
        - $ref: './components/parameters.yaml#/UserSort'
        - $ref: './components/parameters.yaml#/Cursor'
        - $ref: './components/parameters.yaml#/Limit'
      responses:
        '200':
          description: Result envelope (SUCCESS, or BLOCKED with FEATURE_DISABLED when the Slice 4 flag is off).
          headers:
            X-Correlation-ID:
              $ref: './components/headers.yaml#/CorrelationID'
          content:
            application/json:
              schema:
                $ref: './components/hr.yaml#/UserListEnvelope'
        '400':
          $ref: './components/responses.yaml#/Problem'
        '403':
          $ref: './components/responses.yaml#/Denied'
        default:
          $ref: './components/responses.yaml#/Problem'
  /api/v1/identity/users/{user_id}:
    get:
