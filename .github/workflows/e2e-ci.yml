name: Full-stack E2E

# R7-1: real Chromium → built SPA → real cmd/crm-api → disposable PostgreSQL,
# SYNTHETIC data only. Test harness authorization only: nothing here deploys,
# activates a feature or touches a non-CI database. Write flags are switched on
# only inside the disposable database the test creates and drops.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - 'cmd/crm-api/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser → SPA → crm-api → PostgreSQL
    # Pinned: Playwright 1.56.1 (the version validated locally) cannot install
    # Chromium or its system dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      # Disposable CI database. Synthetic fixtures only; never production data.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: crm_ci_only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CRM_TEST_DATABASE_URL: postgres://crm_ci:crm_ci_only@127.0.0.1:5432/postgres?sslmode=disable
      # A missing database fails the job instead of skipping it.
      CRM_TEST_REQUIRE_POSTGRES: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --prefix web

      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install --with-deps chromium

      - name: E2E typecheck and lint
        run: |
          npm --prefix web run typecheck:e2e
          (cd web && npx eslint e2e playwright.config.ts)

      - name: Build the SPA
        run: npm --prefix web run build

      - name: Full-stack E2E (fails on any database, API, frontend or acceptance failure)
        run: go test -tags e2e -count=1 -v -run TestBrowserFullStack ./internal/integration/legacy/shadow/

      - name: Upload failure artifacts (screenshots and report only; no traces, no video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
