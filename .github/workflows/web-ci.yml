name: Web and OpenAPI CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - 'internal/platform/httpx/oapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI validate, generate, stale check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --prefix web

      - name: Validate, bundle and regenerate (Go + TypeScript)
        run: npm --prefix web run openapi:gen

      - name: Generated outputs are current
        shell: bash
        run: |
          generated="api/openapi/openapi.bundled.yaml web/src/generated internal/platform/httpx/oapi/oapi.gen.go"
          if ! git diff --exit-code -- $generated; then
            echo "Generated contract outputs are stale: run 'npm --prefix web run openapi:gen' and commit."; exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- $generated)"
          if [ -n "$untracked" ]; then echo "Untracked generated files:"; echo "$untracked"; exit 1; fi

      - name: Generated Go contract compiles and contract tests pass
        run: go test -count=1 ./internal/platform/httpx/... ./internal/platform/apiserver/ ./internal/platform/authstub/ ./cmd/crm-api/

  frontend:
    name: Frontend typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck (includes generated client and type-level contract tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production bundle carries no dev auth or dev routes
        shell: bash
        run: |
          if grep -l -E 'X-Dev-User|dev-user-|PrimitivesPage|DesignSystemPage|SellerPreviewPage|RM-E03-SYNTHETIC-SELLER-FIXTURE|0900000[0-9]{4}' dist/assets/*.js; then
            echo "Development-only code leaked into the production bundle"; exit 1
          fi
          if ls dist/assets | grep -E 'PrimitivesPage|DesignSystemPage|showcase|SellerPreview|seller'; then
            echo "Development-only chunk emitted into the production build"; exit 1
          fi

  design-system:
    name: Design-system, role-navigation and Seller preview browser checks (RM-E01, RM-E02, RM-E03)
    # Pinned like e2e-ci.yml: Playwright 1.56 ships Chromium for ubuntu-24.04, not ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Typecheck and lint browser tests
        run: npm run typecheck:e2e && npx eslint e2e playwright.ds.config.ts playwright.nav.config.ts playwright.seller.config.ts

      # Starts a local Vite dev server only; no API, database or stack. Desktop 1366 and mobile 390.
      - name: Shared component behaviour in a real browser
        run: npx playwright test -c playwright.ds.config.ts

      # RM-E02: builds the PRODUCTION bundle and serves it with vite preview; every API answer is a
      # synthetic fixture inside the test (presentation evidence, never business authorization).
      - name: Role-oriented navigation in a real browser (production bundle)
        run: npx playwright test -c playwright.nav.config.ts

      # RM-E03: DEV/TEST-only Seller V1 preview on a local Vite dev server; every /api request is
      # answered and recorded inside the test (no business endpoint, no write). 1366 / 1920 / 768 / 390.
      - name: Seller V1 preview in a real browser (synthetic fixtures)
        run: npx playwright test -c playwright.seller.config.ts
