name: Go CI

on:
  pull_request:
    paths:
      - '**.go'
      - '**.sql'
      - '**.sql.tmpl'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/go-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go kernel and platform gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Disposable CI database. Synthetic fixtures only; never production data.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: crm_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CRM_TEST_DATABASE_URL: postgres://crm_ci:crm_ci_only@localhost:5432/postgres?sslmode=disable
      # Integration tests must run in CI; a missing database fails instead of skipping.
      CRM_TEST_REQUIRE_POSTGRES: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (unit + PostgreSQL integration)
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -count=1 -race ./...

      - name: Architecture / import lint
        run: go test -count=1 -run 'TestRepositoryPassesArchitectureLint|TestViolatingFixtureFails|TestFixtureAllowedCases|TestDotImportRule|TestSliceOneRules|TestRuntimeDDLPattern|TestSliceThreeRules|TestAPIServerHasNoLegacyDependency|TestSliceFourRules|TestSliceFiveRules|TestSliceSixRules|TestSliceSevenRules|TestSliceEightRules|TestAPIServerHasNoImportDependency' -v ./internal/architecture/

      - name: Kernel is standard-library only
        shell: bash
        run: |
          module="$(go list -m)"
          bad="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/kernel/... | grep -v -E "^${module}/internal/kernel(/|$)" || true)"
          if [ -n "$bad" ]; then echo "Non-stdlib kernel dependencies:"; echo "$bad"; exit 1; fi
          forbidden="$(go list -deps ./internal/kernel/... | grep -E '^(database/sql.*|net|net/.*|os/exec)$' || true)"
          if [ -n "$forbidden" ]; then echo "Kernel depends on forbidden packages:"; echo "$forbidden"; exit 1; fi

      - name: Kernel coverage >= 90%
        shell: bash
        run: |
          go test -count=1 -coverprofile=kernel.cover ./internal/kernel/...
          total="$(go tool cover -func=kernel.cover | awk '/^total:/ {sub("%","",$3); print $3}')"
          echo "Kernel statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 90.0) ? 0 : 1 }' || { echo "Coverage below 90%"; exit 1; }

      - name: Platform PostgreSQL integration tests (verbose)
        run: go test -count=1 -v ./internal/platform/... ./cmd/...

      - name: Slice 3 legacy connector + staging gates (verbose; synthetic data only)
        run: go test -count=1 -v ./internal/integration/... ./cmd/crm-legacy-import/

      - name: Slice 4 identity / organization / authorization read gates (verbose; synthetic data only)
        run: go test -count=1 -v ./internal/identity/... ./internal/organization/... ./internal/authorization/... ./internal/integration/legacy/shadow/ ./internal/platform/apiserver/ ./internal/platform/pagination/

      - name: Slice 5 customer identity shadow gates (verbose; synthetic data only; zero phone-only RESOLVED / merges)
        run: go test -count=1 -v ./internal/customers/... ./internal/integration/legacy/shadow/ ./cmd/crm-legacy-import/ ./internal/architecture/

      - name: Slice 6 sales read shadow gates (verbose; synthetic data only; append-only custody, attribution immutability, parity)
        run: go test -count=1 -v ./internal/cases/... ./internal/custody/... ./internal/integration/legacy/shadow/ ./cmd/crm-legacy-import/

      - name: Slice 7 billing + payments read shadow gates (verbose; synthetic data only; separate states, per-unit totals, stale-batch reconciliation)
        run: go test -count=1 -v ./internal/billing/... ./internal/payments/... ./internal/integration/legacy/shadow/ ./cmd/crm-legacy-import/ ./cmd/crm-api/ ./internal/architecture/

      - name: Slice 8 MIS / reporting read gates (verbose; synthetic data only; INV-021 parity, temporal modes, audited Invoice Review, no export)
        run: |
          go test -count=1 -v ./internal/reporting/... ./cmd/crm-reporting/ ./cmd/crm-api/
          go test -count=1 -v -run 'Reporting' ./internal/integration/legacy/shadow/

      - name: Slice 8 boundary — crm-api never reaches the projection rebuild
        shell: bash
        run: |
          module="$(go list -m)"
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/reporting/projections$" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on the offline projection rebuild:"; echo "$bad"; exit 1; fi

      - name: Slice 9 finance SHADOW ledger gates (verbose; synthetic data only; double entry, D-41 bases, OPD-06 units, OPD-09 routes, reconciliation, F06/F07)
        run: |
          go test -count=1 -v ./internal/finance/... ./cmd/crm-finance-shadow/ ./cmd/crm-api/
          go test -count=1 -v -run 'Finance' ./internal/integration/legacy/shadow/
          go test -count=1 -v ./internal/integration/legacy/spec/ ./internal/integration/legacy/migrations/
          go test -count=1 -race ./internal/finance/... ./cmd/crm-finance-shadow/
          go test -count=1 -race -run 'Finance' ./internal/integration/legacy/shadow/

      - name: Slice 9 boundary — crm-api never reaches the finance shadow rebuild or the legacy connector
        shell: bash
        run: |
          module="$(go list -m)"
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/(finance/shadow|integration/legacy/.*)$" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on the offline finance shadow rebuild or the legacy connector:"; echo "$bad"; exit 1; fi
          # finance never imports a legacy package, an owner store or the commission engine.
          bad="$(go list -deps ./internal/finance/... | grep -E "^${module}/internal/(integration/legacy/|[a-z]+/store$|commission)" || true)"
          if [ -n "$bad" ]; then echo "finance depends on a legacy, store or commission package:"; echo "$bad"; exit 1; fi

      - name: Slice 10 Biawin / fulfillment READ shadow gates (verbose; synthetic data only; parity, multi-item, D-35/D-38 open, read purity, flag, auth)
        run: |
          go test -count=1 -v ./internal/biawin/... ./internal/fulfillment/... ./internal/integration/biawin/ ./cmd/crm-biawin-shadow/ ./cmd/crm-api/
          go test -count=1 -v -run 'Biawin' ./internal/integration/legacy/shadow/
          go test -count=1 -v -run 'SliceTen|NoProvider|APIServerHasNoImport' ./internal/architecture/
          go test -count=1 -race ./internal/biawin/... ./internal/fulfillment/... ./internal/integration/biawin/ ./cmd/crm-biawin-shadow/
          go test -count=1 -race -run 'Biawin' ./internal/integration/legacy/shadow/

      - name: Slice 10 boundary — no provider, no import command and no legacy connector on the read path
        shell: bash
        run: |
          module="$(go list -m)"
          # No binary reaches the Biawin provider port (no external call in Slice 10).
          bad="$(go list -deps ./cmd/... | grep -E "^${module}/internal/integration/biawin$" || true)"
          if [ -n "$bad" ]; then echo "a command depends on the Biawin provider:"; echo "$bad"; exit 1; fi
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/(biawin|fulfillment)/imports$" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on a Slice 10 import command:"; echo "$bad"; exit 1; fi
          # biawin / fulfillment never import a legacy package, an owner store, finance, billing internals or each other.
          bad="$(go list -deps ./internal/biawin/... ./internal/fulfillment/... | grep -E "^${module}/internal/(integration/|[a-z]+/store$|finance|billing|payments|commission)" || true)"
          if [ -n "$bad" ]; then echo "biawin / fulfillment depend on a forbidden package:"; echo "$bad"; exit 1; fi
          # No provider write operation is named anywhere outside the provider package.
          hits="$(grep -rniE 'create_?order|charge_?wallet' --include=*.go --include=*.ts --include=*.tsx internal cmd web/src | grep -vE '^internal/(integration/biawin|architecture)/' | grep -vE '_test\.go:|\.test\.tsx?:' || true)"
          if [ -n "$hits" ]; then echo "provider write operation named outside internal/integration/biawin:"; echo "$hits"; exit 1; fi

      - name: Slice 11 controlled non-financial write gates (verbose; synthetic legacy only; idempotency, concurrency, UNKNOWN, parity, authority)
        run: |
          go test -count=1 -v ./internal/cases/... ./internal/organization/... ./internal/integration/writeback/... ./internal/integration/legacy/writeback/ ./internal/platform/rollout/ ./cmd/crm-api/
          go test -count=1 -v -run 'ContactOutcome|Writeback|ShadowCompare|HRRequest|WritesHTTP|WritesInvariants' ./internal/integration/legacy/shadow/
          go test -count=1 -v -run 'SliceEleven|NoBusinessOrMutating|RoutesMatchContract|Slice11' ./internal/architecture/ ./internal/platform/httpx/oapi/ ./internal/platform/apiserver/
          go test -count=1 -race ./internal/cases/... ./internal/custody/... ./internal/organization/... ./internal/integration/writeback/... ./internal/integration/legacy/writeback/ ./internal/platform/apiserver/ ./internal/platform/rollout/
          go test -count=1 -race -run 'ContactOutcome|Writeback|ShadowCompare|HRRequest|WritesHTTP|WritesInvariants' ./internal/integration/legacy/shadow/

      - name: Slice 3 / 11 boundary — crm-api never reaches the legacy connector or a write-back worker
        shell: bash
        run: |
          module="$(go list -m)"
          # Slice 11: crm-api may read the integration-owned write-back diagnostics only.
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/integration(/|$)" | grep -vE "^${module}/internal/integration(/writeback(/http)?)?$" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on the integration/legacy connector:"; echo "$bad"; exit 1; fi
          # Domains never import the write-back worker, the legacy connector or a financial module.
          bad="$(go list -deps ./internal/cases/... ./internal/custody/... ./internal/organization/... | grep -E "^${module}/internal/(integration/|billing|payments|finance|commission|biawin|fulfillment)" || true)"
          if [ -n "$bad" ]; then echo "a Slice 11 domain depends on integration or a financial module:"; echo "$bad"; exit 1; fi
          # No invoice-issue / return / transfer / allocation / ready / HR-apply route in the contract.
          if grep -nE "^  /api/v1/.*/(return|returns|release|reset|issue|ready|transfer|transfers|allocate|allocations|apply|transitions?|claims?|bulk)(/|:)" api/openapi/openapi.yaml; then
            echo "a Slice 11 blocked command route appeared in the contract"; exit 1
          fi

      - name: Slice 12 controlled financial write gates (verbose; synthetic legacy and synthetic gateway only; evidence fault injection, idempotency, concurrency, UNKNOWN, D-43, maker/checker)
        run: |
          go test -count=1 -v ./internal/payments/... ./internal/finance/review/ ./internal/platform/objectstore/ ./internal/integration/gateway/... ./internal/billing/query/
          go test -count=1 -v -run 'PaymentBatch|PaymentConcurrency|EvidenceFinalisation|PaymentWriteback|GatewayFlow|PaymentsInvariants|PaymentsHTTP' ./internal/integration/legacy/shadow/
          go test -count=1 -v -run 'SliceTwelve|ViolatingFixture|FixtureAllowed|NoBusinessOrMutating|Slice12' ./internal/architecture/ ./internal/platform/httpx/oapi/ ./internal/platform/apiserver/
          go test -count=1 -race ./internal/payments/... ./internal/finance/... ./internal/platform/objectstore/ ./internal/integration/gateway/... ./internal/integration/writeback/... ./internal/integration/legacy/writeback/
          go test -count=1 -race -run 'PaymentBatch|PaymentConcurrency|EvidenceFinalisation|PaymentWriteback|GatewayFlow|PaymentsInvariants|PaymentsHTTP' ./internal/integration/legacy/shadow/

      - name: Slice 12 boundary — no gateway, connector or decision path reaches crm-api
        shell: bash
        run: |
          module="$(go list -m)"
          bad="$(go list -deps ./cmd/... | grep -E "^${module}/internal/integration/gateway" || true)"
          if [ -n "$bad" ]; then echo "a command wires a gateway adapter:"; echo "$bad"; exit 1; fi
          bad="$(go list -deps ./internal/payments/... ./internal/finance/review/ | grep -E "^${module}/internal/(integration|cases|custody|biawin|fulfillment|commission|identity/(store|imports|query))(/|$)" || true)"
          if [ -n "$bad" ]; then echo "payments / the Finance review gate reach integration or another module's internals:"; echo "$bad"; exit 1; fi
          # No review decision, posting, refund, settlement, next-stage, gateway or invoice-issue route in the contract.
          if grep -nE "^  /api/v1/.*/(approve|approvals|reject|rejections|decisions|postings|refunds?|settle|settlements|next-stage|callback|callbacks|bulk-approve)(/|:)" api/openapi/openapi.yaml | grep -v "/hr/requests/{request_id}/decisions"; then
            echo "a Slice 12 blocked financial route appeared in the contract"; exit 1
          fi

      - name: Slice 13 commission controlled SHADOW gates (verbose; synthetic legacy only; exact amounts, entitlement identity, lifecycle, parity, no posting)
        run: |
          go test -count=1 -v ./internal/commission/... ./cmd/crm-commission-shadow/ ./internal/integration/legacy/spec/ ./internal/integration/legacy/migrations/
          go test -count=1 -v -run 'Commission' ./internal/integration/legacy/shadow/ ./cmd/crm-api/
          go test -count=1 -v -run 'ViolatingFixture|FixtureAllowed|RepositoryPasses|NoBusinessOrMutating|QueryAllowlist' ./internal/architecture/ ./internal/platform/httpx/oapi/ ./internal/platform/apiserver/
          go test -count=1 -race ./internal/commission/... ./cmd/crm-commission-shadow/
          go test -count=1 -race -run 'Commission' ./internal/integration/legacy/shadow/

      - name: Slice 13 boundary — no posting, finance write, connector or shadow job on the read path
        shell: bash
        run: |
          module="$(go list -m)"
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/commission/shadow$" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on the offline commission shadow job:"; echo "$bad"; exit 1; fi
          # commission never reaches finance, wallet, billing, payments, organization (current hierarchy) or the legacy connector.
          bad="$(go list -deps ./internal/commission/... | grep -E "^${module}/internal/(integration|finance|billing|payments|organization|cases|custody|biawin|fulfillment|reporting|customers)(/|$)" || true)"
          if [ -n "$bad" ]; then echo "commission depends on a forbidden package:"; echo "$bad"; exit 1; fi
          # No approve / post / credit / settle / reverse / recalculate commission route in the contract.
          if grep -nE "^  /api/v1/commission/.*(approve|reject|post|postings|credit|settle|reverse|recalculate|calculate|backfill)" api/openapi/openapi.yaml; then
            echo "a Slice 13 blocked commission route appeared in the contract"; exit 1
          fi

      - name: Slice 14 controlled fulfillment / Biawin gates (verbose; synthetic adapter only; fan-out, branches, D-35/D-38 blocks, per-service scope, write-ahead UNKNOWN, callbacks, relay faults, HTTP)
        run: |
          go test -count=1 -v ./internal/catalog/... ./internal/biawin/... ./internal/fulfillment/... ./internal/integration/biawin/ ./internal/integration/providerops/... ./internal/platform/relay/
          go test -count=1 -v -run 'Operations' ./cmd/crm-api/
          go test -count=1 -v -run 'SliceFourteen|ViolatingFixture|FixtureAllowed|RepositoryPasses|NoBusinessOrMutating|QueryAllowlist|APIServerHasNoLegacy|NoProviderInComposed' ./internal/architecture/ ./internal/platform/httpx/oapi/ ./internal/platform/apiserver/
          go test -count=1 -race ./internal/catalog/... ./internal/biawin/... ./internal/fulfillment/... ./internal/integration/biawin/ ./internal/integration/providerops/... ./internal/platform/relay/

      - name: Slice 14 boundary — no provider port, wallet charge or production activation on the API path
        shell: bash
        run: |
          module="$(go list -m)"
          # crm-api may reach the provider-operation ledger read + reconciliation, never a port or the provider package.
          bad="$(go list -deps ./cmd/crm-api | grep -E "^${module}/internal/integration/(biawin|legacy|gateway)(/|$)" || true)"
          if [ -n "$bad" ]; then echo "crm-api depends on a provider / connector package:"; echo "$bad"; exit 1; fi
          # No command reaches the Biawin provider package (only tests use the synthetic adapter).
          bad="$(go list -deps ./cmd/... | grep -E "^${module}/internal/integration/biawin$" || true)"
          if [ -n "$bad" ]; then echo "a command depends on the Biawin provider package"; exit 1; fi
          # The domains never reach finance, billing, payments, commission, organization (hierarchy) or integration.
          bad="$(go list -deps ./internal/catalog/... ./internal/biawin/activation/ ./internal/fulfillment/work/ | grep -E "^${module}/internal/(integration|finance|billing|payments|commission|organization|cases|custody|reporting|customers)(/|$)" || true)"
          if [ -n "$bad" ]; then echo "a Slice 14 domain depends on a forbidden package:"; echo "$bad"; exit 1; fi
          # No activation / charge / dispatch / cancel / reopen / review route in the contract.
          if grep -nE "^  /api/v1/(biawin|fulfillment|integration)/.*(activate|activation$|charge|wallet|dispatch|retry|cancel|reopen|review|ship|order)" api/openapi/openapi.yaml; then
            echo "a Slice 14 blocked route appeared in the contract"; exit 1
          fi
          # Feature flags default OFF: no Slice 14 flag is seeded by a migration.
          if grep -rnE "fulfillment\.work_(read|write|writeback)|integration\.provider_reconcile" --include='*.sql' internal/ ; then
            echo "a Slice 14 feature flag is seeded by a migration (must default OFF)"; exit 1
          fi

      - name: Slice 3 — no snapshot content tracked
        shell: bash
        run: |
          tracked="$(git ls-files '*.ndjson' '**/manifest.json' 'snapshots/**' 'legacy-snapshot*/**' 'crm-legacy-snapshot*/**')"
          if [ -n "$tracked" ]; then echo "Snapshot content must never be committed:"; echo "$tracked"; exit 1; fi

      - name: crm-migrate on an empty database (apply, repeat, status)
        shell: bash
        env:
          PGPASSWORD: crm_ci_only
        run: |
          psql -h localhost -U crm_ci -d postgres -c 'CREATE DATABASE crm_migrate_ci'
          export CRM_MIGRATE_DATABASE_URL='postgres://crm_ci:crm_ci_only@localhost:5432/crm_migrate_ci?sslmode=disable'
          go run ./cmd/crm-migrate up
          # Capture output once: under pipefail, `cmd | grep -q` can kill cmd
          # with SIGPIPE once grep has matched.
          up="$(go run ./cmd/crm-migrate up)"
          grep -q 'no pending migrations' <<< "$up"
          status="$(go run ./cmd/crm-migrate status)"
          echo "$status"
          ! grep -q pending <<< "$status"
          grep -q 'applied  00001_integration_staging.sql' <<< "$status"
          stg="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'integration' AND table_name LIKE 'stg\_%'")"
          test "$stg" = "37" || { echo "expected 37 integration staging tables (Slice 3 + invoice issued-to + Slice 6 sales + Slice 7 billing + Slice 9 wallets + Slice 10 Biawin / fulfillment + Slice 13 commission), got $stg"; exit 1; }
          grep -q 'applied  00003_integration_staging_invoice_issued_to.sql' <<< "$status"
          grep -q 'applied  00004_integration_staging_sales.sql' <<< "$status"
          grep -q 'applied  00001_identity.sql' <<< "$status"
          grep -q 'applied  00001_organization.sql' <<< "$status"
          s4="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema IN ('identity', 'organization')")"
          test "$s4" = "25" || { echo "expected 25 identity/organization tables (incl. per-module outbox/inbox/idempotency and the Slice 11 HR request tables), got $s4"; exit 1; }
          creds="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'identity' AND table_name IN ('credential', 'session')")"
          test "$creds" = "0" || { echo "Slice 4 must not create credential/session tables"; exit 1; }
          # Slice 5 customer identity (shadow).
          grep -q 'applied  00002_identity_customer_capabilities.sql' <<< "$status"
          grep -q 'applied  00001_customers.sql' <<< "$status"
          s5="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'customers'")"
          test "$s5" = "14" || { echo "expected 14 customers tables (incl. outbox/inbox/idempotency), got $s5"; exit 1; }
          # Gate-0: phone is never a key. No unique index or PK touches a phone/e-mail/normalized value.
          phonekey="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM pg_indexes WHERE schemaname = 'customers' AND indexdef ILIKE '%UNIQUE%' AND (indexdef ILIKE '%normalized%' OR indexdef ILIKE '%phone%' OR indexdef ILIKE '%email%')")"
          test "$phonekey" = "0" || { echo "customers has a unique index on a phone/e-mail/normalized value"; exit 1; }
          # Only the customers owner role is granted on customers tables, and never DELETE.
          foreign="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema = 'customers' AND grantee NOT IN ('crm_owner_customers', current_user)")"
          test "$foreign" = "0" || { echo "foreign role granted on customers tables"; exit 1; }
          del="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema = 'customers' AND grantee = 'crm_owner_customers' AND privilege_type IN ('DELETE', 'TRUNCATE')")"
          test "$del" = "0" || { echo "customers owner must not hold DELETE/TRUNCATE"; exit 1; }
          # Slice 6 sales read shadow (cases + custody).
          grep -q 'applied  00003_identity_sales_capabilities.sql' <<< "$status"
          for f in 00001_cases.sql 00002_cases_append_only_guards.sql 00001_custody.sql 00002_custody_append_only_guards.sql; do
            grep -q "applied  $f" <<< "$status" || { echo "$f not applied"; exit 1; }
          done
          s6="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT string_agg(table_schema || '=' || n, ',' ORDER BY table_schema) FROM (SELECT table_schema, count(*) n FROM information_schema.tables WHERE table_schema IN ('cases', 'custody') GROUP BY 1) x")"
          test "$s6" = "cases=13,custody=7" || { echo "expected cases=13,custody=7 tables (Slice 6 + Slice 11 contact outcome), got $s6"; exit 1; }
          # Append-only: no DELETE/TRUNCATE anywhere, no UPDATE (table or column) on events/history/snapshots.
          bad="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema IN ('cases', 'custody') AND grantee <> current_user AND (privilege_type IN ('DELETE', 'TRUNCATE') OR (privilege_type = 'UPDATE' AND table_name IN ('custody_event', 'case_state_history', 'attribution_snapshot')))")"
          test "$bad" = "0" || { echo "cases/custody grants allow mutating append-only history"; exit 1; }
          col="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.column_privileges WHERE table_schema IN ('cases', 'custody') AND grantee <> current_user AND privilege_type = 'UPDATE' AND table_name IN ('custody_event', 'case_state_history', 'attribution_snapshot')")"
          test "$col" = "0" || { echo "column UPDATE granted on append-only history"; exit 1; }
          foreign="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(*) FROM information_schema.role_table_grants WHERE (table_schema = 'cases' AND grantee NOT IN ('crm_owner_cases', current_user)) OR (table_schema = 'custody' AND grantee NOT IN ('crm_owner_custody', current_user))")"
          test "$foreign" = "0" || { echo "foreign role granted on cases/custody"; exit 1; }
          guards="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT count(DISTINCT event_object_table) FROM information_schema.triggers WHERE trigger_name LIKE '%_append_only' AND trigger_schema IN ('cases', 'custody')")"
          test "$guards" = "5" || { echo "append-only triggers missing: $guards"; exit 1; }
          # Slice 7 billing + payments read shadow.
          for f in 00005_integration_staging_billing.sql 00004_identity_billing_capabilities.sql 00001_billing.sql 00001_payments.sql 00002_payments_append_only_guards.sql; do
            grep -q "applied  $f" <<< "$status" || { echo "$f not applied"; exit 1; }
          done
          s7="$(psql -h localhost -U crm_ci -d crm_migrate_ci -tAc "SELECT string_agg(table_schema || '=' || n, ',' ORDER BY table_schema) FROM (SELECT table_schema, count(*) n FROM information_schema.tables WHERE table_schema IN ('billing', 'payments') GROUP BY 1) x")"
          test "$s7" = "billing=9,payments=20" || { echo "expected billing=9,payments=20 tables (Slice 7 + Slice 12 evidence, batches, attempts, gateway, upload history), got $s7"; exit 1; }
