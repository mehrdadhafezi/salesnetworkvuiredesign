<script>
  /* Same pre-paint preference contract as Seller V1 (shared snproto.* keys, URL params win and are not saved). */
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search), get = function (k) { try { return localStorage.getItem('snproto.' + k); } catch (e) { return null; } };
    var theme = q.get('theme') || get('theme'), density = q.get('density') || get('density'), focus = q.get('focus') || get('focus');
    if (/^(light|dim|dark)$/.test(theme || '')) d.setAttribute('data-theme', theme);
    if (/^(comfortable|compact)$/.test(density || '')) d.setAttribute('data-density', density);
    if (focus === '1') d.setAttribute('data-focus', '1');
  })();
</script>
