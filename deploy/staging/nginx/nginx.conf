# R3 staging reverse proxy / TLS termination (self-signed staging cert,
# generated per environment; never a production certificate or host name).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 6m;
  # Access logs carry method, route and status only: no query string, no
  # cookies, no Authorization / CSRF headers.
  log_format crm '$time_iso8601 $request_method $uri $status $request_time';
  map $http_upgrade $connection_upgrade { default ""; }
  server {
    listen 8443 ssl;
    server_name crm-staging.local;
    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /dev/stdout crm;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/ {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }
    location /health/ { proxy_pass http://api:8080; }
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
